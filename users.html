<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Number Samrat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 0; text-align: center; }
        .header { background: #1e293b; padding: 20px; border-bottom: 2px solid #fbbf24; }
        .card { background: white; color: black; width: 90%; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .balance-amt { font-size: 2.5rem; font-weight: bold; color: #059669; }
        .btn-recharge { display: block; background: #fbbf24; color: black; text-decoration: none; padding: 15px; border-radius: 10px; font-weight: bold; margin-top: 15px; }
        .bet-box { background: #1e293b; width: 90%; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 15px; border: 1px solid #334155; text-align: left; box-sizing: border-box; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #0f172a; color: white; box-sizing: border-box; }
        .btn-bet { width: 100%; background: #3b82f6; color: white; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h3 id="uName">Loading...</h3>
        <p style="font-size: 12px; opacity:0.8;">Agent Code: <span id="myAgentDisplay">--</span></p>
    </div>

    <div class="card">
        <small>Available Balance</small>
        <div class="balance-amt">₹<span id="wallet-bal">0</span></div>
        <!-- Recharge Button -->
        <a href="#" id="zypora-link" class="btn-recharge" target="_blank">➕ RECHARGE WALLET</a>
    </div>

    <div class="bet-box">
        <label>Market:</label>
        <select id="mkt"><option value="GALI">GALI</option><option value="DESAWAR">DESAWAR</option></select>
        <label>Number (00-99):</label>
        <input type="text" id="bet-num" placeholder="Eg: 75">
        <label>Amount (₹):</label>
        <input type="number" id="bet-amt" placeholder="Min 10">
        <button class="btn-bet" onclick="confirmBet()">PLACE BET NOW</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const userId = localStorage.getItem("userId");
        if(!userId) window.location.href = "login_user.html";

        // 1. Live Data Load
        db.collection("users").doc(userId).onSnapshot(doc => {
            if(doc.exists) {
                const data = doc.data();
                document.getElementById("uName").innerText = "Welcome, " + data.name;
                document.getElementById("myAgentDisplay").innerText = data.agentId || "DIRECT";
                document.getElementById("wallet-bal").innerText = data.wallet || 0;
                
                // Recharge Link Fix
                const myLink = "https://zyporapay.com/pay/YOUR_ID"; // <--- Yahan apna link dalo
                document.getElementById("zypora-link").href = myLink + "&remark=" + userId;
            }
        }, (error) => { alert("Database Error: " + error.message); });

        // 2. Bet lagane ka function
        async function confirmBet() {
            const m = document.getElementById("mkt").value;
            const n = document.getElementById("bet-num").value.trim();
            const a = parseInt(document.getElementById("bet-amt").value);

            if(!n || isNaN(a) || a < 10) return alert("Details sahi dalo!");

            try {
                const userRef = db.collection("users").doc(userId);
                const userDoc = await userRef.get();
                const bal = userDoc.data().wallet;

                if(bal < a) return alert("Balance kam hai!");

                // Wallet se paisa kato
                await userRef.update({ wallet: firebase.firestore.FieldValue.increment(-a) });

                // Bet entry dalo
                await db.collection("bets").add({
                    userId: userId,
                    agentId: document.getElementById("myAgentDisplay").innerText,
                    gameName: m,
                    number: n,
                    amount: a,
                    status: "pending",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Bet Lag Gayi! ✅");
                document.getElementById("bet-num").value = "";
                document.getElementById("bet-amt").value = "";
            } catch (e) { alert("Bet Error: " + e.message); }
        }
    </script>
</body>
</html>
