<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Samrat - Play</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .header { background: #ccff00; color: #000; padding: 15px; border-radius: 0 0 20px 20px; margin: -20px -20px 20px -20px; }
        .balance-card { background: #1a1a1a; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .live-num { font-size: 60px; font-weight: bold; color: #ccff00; margin: 10px 0; }
        .input-group { background: #1a1a1a; padding: 20px; border-radius: 15px; }
        input { width: 80%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; background: #333; color: #fff; font-size: 18px; text-align: center; }
        .btn-bid { width: 85%; padding: 15px; background: #ccff00; color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; }
        #msg { margin-top: 15px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0;">NUMBER SAMRAT</h2>
        <small id="marketName">Gali Market</small>
    </div>

    <div class="balance-card">
        <p style="margin:0; color:#888;">Live Result</p>
        <div class="live-num" id="liveNum">--</div>
    </div>

    <div class="balance-card">
        <p style="margin:0; color:#888;">Aapka Balance</p>
        <h2 style="margin:5px 0;">₹<span id="myBal">0</span></h2>
        <input type="text" id="userName" placeholder="Apna Naam Likhein" style="width:70%; padding:8px; font-size:14px;">
    </div>

    <div class="input-group">
        <h3>Boli Lagayein</h3>
        <input type="number" id="bidNumber" placeholder="Number (00-99)">
        <input type="number" id="bidPoints" placeholder="Points (Amount)">
        <button class="btn-bid" onclick="placeBid()">BET LAGAYEIN</button>
        <p id="msg">Apna naam likh kar balance check karein</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            databaseURL: "https://number-samrat-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7bb136ce1c34a11b3f112"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Live Number Load Karo
        db.ref('live_result/current_number').on('value', (snap) => {
            document.getElementById('liveNum').innerText = snap.val();
        });

        // 2. User Balance Load Karo
        document.getElementById('userName').oninput = function() {
            const name = this.value;
            if(name) {
                db.ref('users/' + name).on('value', (snap) => {
                    document.getElementById('myBal').innerText = snap.exists() ? snap.val().wallet_balance : 0;
                });
            }
        };

        // 3. Boli (Bid) Lagane ka Logic
        function placeBid() {
            const name = document.getElementById('userName').value;
            const num = document.getElementById('bidNumber').value;
            const pts = document.getElementById('bidPoints').value;
            const currentBal = parseFloat(document.getElementById('myBal').innerText);

            if(!name || !num || !pts) return alert("Pahle saari details bharo!");
            if(pts > currentBal) return alert("Balance kam hai! Khaiwal se recharge karwayein.");

            // PAISE KATNA AUR BOLI LAGANA
            const userRef = db.ref('users/' + name + '/wallet_balance');
            userRef.set(currentBal - parseFloat(pts)).then(() => {
                // Boli save karna
                db.ref('bids/' + name).push({
                    number: num,
                    amount: pts,
                    time: new Date().toLocaleTimeString()
                });
                alert("Boli Lag Gayi!");
                document.getElementById('bidNumber').value = "";
                document.getElementById('bidPoints').value = "";
            });
        }
    </script>
</body>
</html>
