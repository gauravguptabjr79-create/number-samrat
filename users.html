<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; text-align: center; }
        .header { background: #1e293b; color: white; padding: 20px; border-bottom: 2px solid #fbbf24; }
        .card { background: white; margin: 20px auto; width: 85%; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .balance { font-size: 2rem; color: #10b981; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <!-- Yahan Naam dikhega -->
        <h3 id="uName">Loading...</h3>
        <p style="font-size: 12px; opacity: 0.8;">Agent: <span id="myAgent">--</span></p>
    </div>

    <div class="card">
        <small>Wallet Balance</small>
        <div class="balance">₹<span id="bal">0</span></div>
    </div>

    <!-- Bet lagane ka purana code niche waisa hi rahega -->

<script>
    const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userId = localStorage.getItem("userId");
    if(!userId) window.location.href = "login_user.html";

    // DATABASE SE LIVE DATA UTHANA
    db.collection("users").doc(userId).onSnapshot(doc => {
        if(doc.exists) {
            const data = doc.data();
            // 1. Naam set karo
            document.getElementById("uName").innerText = "Welcome, " + (data.name || "User");
            // 2. Wallet set karo
            document.getElementById("bal").innerText = data.wallet || 0;
            // 3. Agent Code set karo
            document.getElementById("myAgent").innerText = data.agentId || "DIRECT";
        } else {
            console.log("No such document!");
        }
    });
</script>
</body>
</html>
