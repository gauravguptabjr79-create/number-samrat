<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Number Samrat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; padding: 0; text-align: center; }
        .header { background: #1e293b; padding: 25px 15px; border-bottom: 2px solid #fbbf24; position: relative; }
        .logout-btn { position: absolute; right: 10px; top: 15px; background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .card { background: white; color: black; width: 90%; max-width: 400px; margin: -20px auto 20px; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .balance-amt { font-size: 2.5rem; font-weight: bold; color: #059669; }
        .btn-recharge { display: block; background: #fbbf24; color: black; text-decoration: none; padding: 15px; border-radius: 10px; font-weight: bold; margin-top: 15px; font-size: 1.1rem; }
        .bet-box { background: #1e293b; width: 90%; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 15px; border: 1px solid #334155; text-align: left; box-sizing: border-box; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #0f172a; color: white; box-sizing: border-box; font-size: 1rem; }
        .btn-bet { width: 100%; background: #3b82f6; color: white; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <button class="logout-btn" onclick="logout()">LOGOUT</button>
        <h3 id="uName">Namaste, User</h3>
        <p style="font-size: 12px; opacity:0.8;">Agent: <span id="myAgentDisplay">--</span></p>
    </div>

    <div class="card">
        <small>Available Balance</small>
        <div class="balance-amt">₹<span id="wallet-bal">0</span></div>
        
        <!-- RECHARGE BUTTON: Ye target="_blank" hona chahiye taaki naye tab mein khule -->
        <a href="javascript:void(0)" id="recharge-link" class="btn-recharge" onclick="openPayment()">➕ RECHARGE WALLET (Min ₹200)</a>
    </div>

    <div class="bet-box">
        <label>Market Chunein:</label>
        <select id="mkt">
            <option value="DESAWAR">DESAWAR (05:00 AM)</option>
            <option value="FARIDABAD">FARIDABAD (06:00 PM)</option>
            <option value="GHAZIABAD">GHAZIABAD (08:15 PM)</option>
            <option value="GALI">GALI (11:50 PM)</option>
        </select>
        <label>Number (00-99):</label>
        <input type="text" id="bet-num" placeholder="Eg: 75">
        <label>Amount (₹):</label>
        <input type="number" id="bet-amt" placeholder="Min ₹10">
        <button class="btn-bet" onclick="confirmBet()">PLACE BET NOW</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const userId = localStorage.getItem("userId");
        if(!userId) window.location.href = "login_user.html";

        // 1. DATA LOAD LOGIC
        db.collection("users").doc(userId).onSnapshot(doc => {
            if(doc.exists) {
                const data = doc.data();
                document.getElementById("uName").innerText = "Welcome, " + data.name;
                document.getElementById("myAgentDisplay").innerText = data.agentId || "DIRECT";
                document.getElementById("wallet-bal").innerText = data.wallet || 0;
            }
        });

        // 2. PAYMENT GATEWAY LOGIC (Zyporapay)
        function openPayment() {
            // Bhai, apna asli Zyporapay payment link yahan chipka do
            const baseLink = "https://zyphorapay.com/payment?key=WE9lGjPq1EbLtdjm2PLUXNCGLs49JCMJEAwzxGLE"; 
            
            if (baseLink.includes("YOUR_MERCHANT_ID")) {
                alert("Bhai, pehle apna Zyporapay link code mein dalo!");
                return;
            }
            
            // Remark mein User ID bhej rahe hain taaki automation chale
            const finalLink = baseLink + "&remark=" + userId;
            window.open(finalLink, "_blank"); // Naye tab mein link khulega
        }

        // 3. BET LOGIC
        async function confirmBet() {
            const m = document.getElementById("mkt").value;
            const n = document.getElementById("bet-num").value.trim();
            const a = parseInt(document.getElementById("bet-amt").value);

            if(!n || isNaN(a) || a < 10) return alert("Details sahi dalo!");

            try {
                const userRef = db.collection("users").doc(userId);
                const userDoc = await userRef.get();
                if(userDoc.data().wallet < a) return alert("Balance kam hai!");

                await userRef.update({ wallet: firebase.firestore.FieldValue.increment(-a) });
                await db.collection("bets").add({
                    userId: userId,
                    agentId: document.getElementById("myAgentDisplay").innerText,
                    gameName: m,
                    number: n,
                    amount: a,
                    status: "pending",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Bet Lag Gayi! ✅");
            } catch (e) { alert("Bet Error: " + e.message); }
        }

        function logout() { localStorage.clear(); window.location.href = "index.html"; }
    </script>
</body>
</html>
