<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Samrat - Play</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .live-num { font-size: 50px; color: #ccff00; font-weight: bold; }
        input { width: 80%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; background: #333; color: #fff; font-size: 18px; text-align: center; }
        button { width: 85%; padding: 15px; background: #ccff00; color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <h2 style="color:#ccff00;">NUMBER SAMRAT</h2>
    <div class="card">
        <p>LIVE RESULT</p>
        <div class="live-num" id="liveNum">--</div>
    </div>
    <div class="card">
        <p>Aapka Balance: ₹<span id="myBal">0</span></p>
        <input type="text" id="userName" placeholder="Apna Naam Likhein">
    </div>
    <div class="card">
        <input type="number" id="bidNum" placeholder="Number (00-99)">
        <input type="number" id="bidPts" placeholder="Points (Amount)">
        <button onclick="placeBid()">BET LAGAYEIN</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            databaseURL: "https://number-samrat-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7bb136ce1c34a11b3f112"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('live_result/current_number').on('value', (snap) => { document.getElementById('liveNum').innerText = snap.val(); });

        document.getElementById('userName').oninput = function() {
            db.ref('users/' + this.value).on('value', (snap) => {
                document.getElementById('myBal').innerText = snap.exists() ? snap.val().wallet_balance : 0;
            });
        };

        function placeBid() {
            const name = document.getElementById('userName').value;
            const num = document.getElementById('bidNum').value;
            const pts = document.getElementById('bidPts').value;
            if(!name || !num || !pts) return alert("Sab kuch bharo!");

            const bidAmt = parseFloat(pts);
            const userRef = db.ref('users/' + name + '/wallet_balance');

            userRef.transaction((current) => {
                if (current === null) return 0;
                if (current < bidAmt) return; // Cancel transaction
                return current - bidAmt;
            }, (error, committed) => {
                if (committed) {
                    db.ref('bids/' + name).push({ number: num, amount: bidAmt });
                    alert("Boli Lag Gayi!");
                    document.getElementById('bidPts').value = "";
                } else {
                    alert("Balance kam hai!");
                }
            });
        }
    </script>
</body>
</html>
