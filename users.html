<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Number Samrat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; padding: 0; }
        .header { background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); padding: 25px 15px; text-align: center; border-bottom: 2px solid #fbbf24; }
        .balance-card { background: white; color: #1e293b; width: 85%; margin: -30px auto 20px; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .balance-amt { font-size: 2.2rem; font-weight: 800; color: #059669; }
        
        /* RECHARGE BUTTON */
        .btn-recharge { display: block; background: #fbbf24; color: black; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 1.1rem; margin-top: 15px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .game-section { padding: 20px; }
        .input-group { background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.9rem; }
        select, input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; box-sizing: border-box; }
        .btn-bet { width: 100%; background: #3b82f6; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        
        .history-section { padding: 0 20px 40px; }
        .bet-card { background: #1e293b; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #64748b; }
        .status-win { border-left-color: #10b981; color: #10b981; }
        .status-loss { border-left-color: #ef4444; color: #ef4444; }
        .status-pending { border-left-color: #fbbf24; color: #fbbf24; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0; color: #fbbf24;">Number Samrat 👑</h2>
        <p id="user-name" style="margin:5px 0 0 0; opacity: 0.8;">Loading...</p>
    </div>

    <div class="balance-card">
        <div style="font-size: 0.9rem; color: #64748b;">Aapka Balance</div>
        <div class="balance-amt">₹<span id="wallet-balance">0</span></div>
        
        <!-- RECHARGE BUTTON (Zyporapay Link yahan update hoga) -->
        <a href="#" id="recharge-btn" class="btn-recharge">➕ ADD MONEY (RECHARGE)</a>
    </div>

    <div class="game-section">
        <div class="input-group">
            <label>Market Chunein:</label>
            <select id="market">
                <option value="DESAWAR">DESAWAR (05:00 AM)</option>
                <option value="FARIDABAD">FARIDABAD (06:00 PM)</option>
                <option value="GHAZIABAD">GHAZIABAD (08:15 PM)</option>
                <option value="GALI">GALI (11:50 PM)</option>
            </select>

            <label>Number Daalein (00-99):</label>
            <input type="text" id="bet-number" placeholder="Eg: 75" maxlength="2">

            <label>Amount (₹):</label>
            <input type="number" id="bet-amount" placeholder="Min ₹10">

            <button class="btn-bet" onclick="placeBet()">PLACE BET (Boli Lagayein)</button>
        </div>
    </div>

    <div class="history-section">
        <h3 style="color: #fbbf24;">Recent Bets</h3>
        <div id="history-list">
            <p style="color: #475569; font-size: 0.8rem;">No bets yet...</p>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Check Login
        const userId = localStorage.getItem("userId");
        if (!userId) { window.location.href = "login.html"; }

        // --- 2. LIVE BALANCE & RECHARGE LINK ---
        db.collection("users").doc(userId).onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById("wallet-balance").innerText = data.wallet;
                document.getElementById("user-name").innerText = "Namaste, " + data.name;

                // ZYPORAPAY LINK SETUP
                // Bhai, niche apna asli Zyporapay link dalo
                const baseLink = "https://zyporapay.com/pay/YOUR_MERCHANT_ID"; 
                document.getElementById("recharge-btn").href = baseLink + "&remark=" + userId;
            }
        });

        // --- 3. BET HISTORY ---
        db.collection("bets").where("userId", "==", userId).orderBy("timestamp", "desc").limit(10).onSnapshot(snap => {
            let html = "";
            snap.forEach(doc => {
                const b = doc.data();
                const sClass = "status-" + b.status;
                html += `<div class="bet-card ${sClass}">
                    <div><b>${b.gameName}</b><br><small>No: ${b.number}</small></div>
                    <div style="text-align:right;">₹${b.amount}<br><b>${b.status.toUpperCase()}</b></div>
                </div>`;
            });
            if(html) document.getElementById("history-list").innerHTML = html;
        });

        // --- 4. PLACE BET LOGIC ---
        async function placeBet() {
            const game = document.getElementById("market").value;
            const num = document.getElementById("bet-number").value.trim();
            const amt = parseInt(document.getElementById("bet-amount").value);

            if(!num || isNaN(amt) || amt < 10) { alert("Sahi details bhariye!"); return; }

            const userRef = db.collection("users").doc(userId);
            const userDoc = await userRef.get();
            const currentBal = userDoc.data().wallet;

            if(currentBal < amt) { alert("Balance kam hai, Recharge karein!"); return; }

            // Paisa kaato aur entry dalo
            await userRef.update({ wallet: firebase.firestore.FieldValue.increment(-amt) });
            await db.collection("bets").add({
                userId: userId,
                gameName: game,
                number: num,
                amount: amt,
                status: "pending",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Bet Lag Gayi! Best of Luck.");
            document.getElementById("bet-number").value = "";
            document.getElementById("bet-amount").value = "";
        }
    </script>
</body>
</html>
