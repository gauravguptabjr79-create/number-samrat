<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard - Number Samrat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial; background: #f4f4f4; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; width: 300px; display: inline-block; margin-top: 50px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .wallet-box { background: #4caf50; color: white; padding: 10px; border-radius: 5px; margin-bottom: 20px; font-size: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #2196f3; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>User Panel</h2>
        <div class="wallet-box">Wallet: ₹<span id="balance">0</span></div>
        
        <hr>
        <h4>Place Your Bet</h4>
        <input type="text" id="gameName" placeholder="Market (GALI, DESAWAR)">
        <input type="text" id="number" placeholder="Number (00-99)">
        <input type="number" id="amount" placeholder="Amount (₹)">
        <button onclick="placeBet()">Confirm Bet</button>
    </div>

    <script>
        // --- APKI FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Maan lo is User ki ID ye hai (Jo aapne manual banayi thi)
        const currentUserId = "OO27u1mB7r522mamy56g";

        // Wallet Balance Load Karna
        db.collection("users").doc(currentUserId).onSnapshot((doc) => {
            document.getElementById("balance").innerText = doc.data().wallet;
        });

        async function placeBet() {
            const game = document.getElementById("gameName").value.toUpperCase();
            const num = document.getElementById("number").value;
            const amt = parseInt(document.getElementById("amount").value);

            if(!game || !num || !amt) { alert("Sab kuch bhariye!"); return; }

            const userRef = db.collection("users").doc(currentUserId);
            const userDoc = await userRef.get();
            const currentBalance = userDoc.data().wallet;

            if(currentBalance < amt) {
                alert("Paise kam hain bhai!");
                return;
            }

            // 1. User ke wallet se paise kaato
            await userRef.update({ wallet: firebase.firestore.FieldValue.increment(-amt) });

            // 2. Bets collection mein entry dalo
            await db.collection("bets").add({
                userId: currentUserId,
                gameName: game,
                number: num,
                amount: amt,
                status: "pending",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Bet Lag Gayi! Best of Luck.");
        }
    </script>
</body>
</html>
