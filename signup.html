<!DOCTYPE html>
<html>
<head>
    <title>Signup - Number Samrat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 90%; max-width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>New Registration</h2>
    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="phone" placeholder="Mobile Number">
    <input type="password" id="pass" placeholder="Set Password">
    <button onclick="reg()">Register Now</button>
    <p style="margin-top:15px; font-size:13px;">Already have an account? <a href="login.html">Login</a></p>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function reg() {
        const n = document.getElementById("name").value;
        const ph = document.getElementById("phone").value;
        const pw = document.getElementById("pass").value;

        if(!n || !ph || !pw) return alert("All fields required!");

        const check = await db.collection("users").where("phone", "==", ph).get();
        if(!check.empty) return alert("Bhai ye number pehle se register hai!");

        await db.collection("users").add({
            name: n, phone: ph, password: pw, wallet: 0, status: "active"
        });
        alert("Account Created! Now Login.");
        window.location.href = "login.html";
    }
</script>
</body>
</html>
