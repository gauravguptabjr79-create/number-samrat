<!DOCTYPE html>
<html>
<head>
    <title>Signup - Number Samrat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; background: #f0f2f5; padding-top: 50px;">
    <div style="background: white; padding: 30px; border-radius: 15px; display: inline-block; width: 85%; max-width: 350px;">
        <h2>Naya Account</h2>
        <input type="text" id="n" placeholder="Naam" style="width:100%; padding:10px; margin:5px 0;">
        <input type="text" id="p" placeholder="Phone Number" style="width:100%; padding:10px; margin:5px 0;">
        <input type="password" id="pw" placeholder="Password" style="width:100%; padding:10px; margin:5px 0;">
        <input type="text" id="ag" placeholder="Agent Code (Phone No)" style="width:100%; padding:10px; margin:5px 0;">
        <button onclick="register()" style="width:100%; padding:10px; background:#10b981; color:white; border:none; border-radius:5px; margin-top:10px; font-weight:bold;">CREATE ACCOUNT</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function register() {
            const name = document.getElementById("n").value;
            const phone = document.getElementById("p").value;
            const pass = document.getElementById("pw").value;
            const agent = document.getElementById("ag").value || "DIRECT";

            if(!name || !phone || !pass) return alert("Sab bhariye!");

            await db.collection("users").add({
                name: name,
                phone: phone,
                password: pass,
                agentId: agent, // <--- Iska naam dhyan rakna
                wallet: 0,
                status: "active"
            });
            alert("Account Ban Gaya! Login Karein.");
            window.location.href = "login_user.html";
        }
    </script>
</body>
</html>
