<html>
<head>
    <title>Signup - Number Samrat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>📝 New User</h2>
    <input type="text" id="name" placeholder="Apna Naam">
    <input type="text" id="phone" placeholder="Mobile Number">
    <input type="password" id="pass" placeholder="Password">
    <input type="text" id="agent" placeholder="Agent Code (Optional)">
    <button onclick="register()">Create Account</button>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function register() {
        const n = document.getElementById("name").value.trim();
        const p = document.getElementById("phone").value.trim();
        const pw = document.getElementById("pass").value.trim();
        const a = document.getElementById("agent").value.trim() || "DIRECT";

        if(!n || !p || !pw) return alert("Bhai saari details bharo!");

        await db.collection("users").add({
            name: n,
            phone: p,
            password: pw,
            agentId: a, // <--- Ye "agentId" ke naam se save ho raha hai
            wallet: 0,
            status: "active"
        });

        alert("Account Ban Gaya! Ab Login Karein.");
        window.location.href = "login_user.html";
    }
</script>
</body>
</html>
