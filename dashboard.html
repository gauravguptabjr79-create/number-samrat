<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Samrat - Live Khaiwal Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f4f6f9; color: #333; }
        .navbar { background: #1e3799; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 20px; font-weight: bold; }
        .refresh-btn { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        
        .wallet-section { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .wallet-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #1e3799; }
        .wallet-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .card { padding: 20px; border-radius: 8px; color: white; }
        .card-total { background: #2980b9; } 
        .card-paying { background: #c0392b; } 
        .card-profit { background: #27ae60; } 
        .card p { font-size: 14px; opacity: 0.9; margin-bottom: 5px; }
        .card h2 { font-size: 26px; font-weight: bold; }

        .ledger-section { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background: #f8f9fa; color: #555; }
        
        .status-plus { color: #27ae60; font-weight: bold; }
        .status-minus { color: #c0392b; font-weight: bold; }
        .status-pending { color: #f39c12; font-weight: bold; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">👑 Number Samrat (Khaiwal Panel)</div>
        <button class="refresh-btn" onclick="updateDashboard()">Live Refresh</button>
    </div>

    <div class="container">
        <div class="wallet-section">
            <div class="wallet-title">💰 Live Hisab-Kitab (Bids Folder)</div>
            <div class="wallet-grid">
                <div class="card card-total">
                    <p>Total Collection (Aaya)</p>
                    <h2 id="totalCollection">₹ 0</h2>
                </div>
                <div class="card card-paying">
                    <p>Total Paying (Dena)</p>
                    <h2 id="totalPaying">₹ 0</h2>
                </div>
                <div class="card card-profit" id="profitCard">
                    <p>Net Profit / Loss</p>
                    <h2 id="netProfit">₹ 0</h2>
                </div>
            </div>
        </div>

        <div class="ledger-section">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>User Name</th>
                            <th>Number</th>
                            <th>Points</th>
                            <th>Status / Result</th>
                        </tr>
                    </thead>
                    <tbody id="ledgerBody">
                        <tr><td colspan="4" style="text-align:center; padding:20px;">Fetching Bids...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // UPDATE: 'bids.json' lagaya hai kyunki data bids ke andar hai
        const targetUrl = "https://number-samrat-default-rtdb.asia-southeast1.firebasedatabase.app/bids.json";

        function updateDashboard() {
            fetch(targetUrl)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('ledgerBody');
                    
                    if (!data) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px;">Abhi koi bids nahi hain.</td></tr>';
                        return;
                    }

                    let collection = 0;
                    let paying = 0;
                    let rowsHtml = '';

                    // Firebase Data ko loop mein daalna
                    Object.keys(data).forEach(key => {
                        const item = data[key];
                        if(!item) return;

                        const points = Number(item.points || 0);
                        const name = item.username || "N/A";
                        const bidNo = item.bidNumber || "-";
                        const status = (item.status || "pending").toLowerCase();

                        collection += points;

                        let statusHtml = '';
                        if (status === 'win') {
                            const winAmount = points * 90;
                            paying += winAmount;
                            statusHtml = `<span class="status-minus">Win (Dena: ₹${winAmount})</span>`;
                        } else if (status === 'loss') {
                            statusHtml = `<span class="status-plus">Loss (Bacha: ₹${points})</span>`;
                        } else {
                            statusHtml = `<span class="status-pending">Pending</span>`;
                        }

                        rowsHtml += `<tr>
                            <td>${name}</td>
                            <td>${bidNo}</td>
                            <td>₹${points}</td>
                            <td>${statusHtml}</td>
                        </tr>`;
                    });

                    tbody.innerHTML = rowsHtml;
                    document.getElementById('totalCollection').innerText = '₹ ' + collection.toLocaleString('en-IN');
                    document.getElementById('totalPaying').innerText = '₹ ' + paying.toLocaleString('en-IN');
                    
                    const net = collection - paying;
                    const netElem = document.getElementById('netProfit');
                    netElem.innerText = '₹ ' + net.toLocaleString('en-IN');
                    
                    // Card color logic
                    document.getElementById('profitCard').style.background = net >= 0 ? '#27ae60' : '#c0392b';
                })
                .catch(err => {
                    console.error("Error:", err);
                    document.getElementById('ledgerBody').innerHTML = '<tr><td colspan="4" style="color:red; text-align:center;">Network Error! Check URL.</td></tr>';
                });
        }

        // Har 3 second mein auto-update
        setInterval(updateDashboard, 3000);
        updateDashboard();
    </script>
</body>
</html>
