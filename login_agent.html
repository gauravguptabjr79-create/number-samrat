<!DOCTYPE html>
<html>
<head>
    <title>Agent Login - Number Samrat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial; background: #1e293b; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #334155; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); width: 90%; max-width: 320px; text-align: center; color: white; }
        h2 { color: #fbbf24; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #fbbf24; color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>💼 Agent Login</h2>
    <input type="text" id="user" placeholder="Agent Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Access Dashboard</button>
    <p style="font-size: 12px; margin-top: 15px;">Agent banna hai? <a href="agent_signup.html" style="color:#fbbf24;">Yahan Apply Karein</a></p>
    <p style="font-size: 12px;"><a href="index.html" style="color:white;">Peeche Jayein</a></p>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function login() {
        const user = document.getElementById("user").value.trim();
        const pass = document.getElementById("pass").value.trim();

        const res = await db.collection("admins").where("username", "==", user).where("password", "==", pass).get();
        if(!res.empty) {
            const doc = res.docs[0];
            if(doc.data().status !== "active") return alert("Bhai, aapka account abhi Pending hai!");
            
            localStorage.setItem("userId", doc.id);
            localStorage.setItem("role", "admin");
            window.location.href = "khaiwal.html";
        } else { alert("Agent Details Galat Hain!"); }
    }
</script>
</body>
</html>
