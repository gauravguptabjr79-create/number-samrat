<!DOCTYPE html>
<html>
<head>
    <title>User Login - Number Samrat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 90%; max-width: 320px; text-align: center; }
        h2 { color: #3b82f6; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>👤 User Login</h2>
    <input type="text" id="phone" placeholder="Mobile Number">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Login Now</button>
    <p style="font-size: 12px; margin-top: 15px;">Naya account? <a href="signup.html">Register Karein</a></p>
    <p style="font-size: 12px;"><a href="index.html">Peeche Jayein</a></p>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function login() {
        const phone = document.getElementById("phone").value.trim();
        const pass = document.getElementById("pass").value.trim();

        const res = await db.collection("users").where("phone", "==", phone).where("password", "==", pass).get();
        if(!res.empty) {
            localStorage.setItem("userId", res.docs[0].id);
            localStorage.setItem("role", "user");
            window.location.href = "users.html";
        } else { alert("User Details Galat Hain!"); }
    }
</script>
</body>
</html>
