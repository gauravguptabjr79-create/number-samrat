<!DOCTYPE html>
<html>
<head>
    <title>Login - Number Samrat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 90%; max-width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .toggle { margin-top: 15px; font-size: 13px; color: #666; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h2 id="title">User Login</h2>
    <input type="text" id="u" placeholder="Phone Number / Username">
    <input type="password" id="p" placeholder="Password">
    <button onclick="login()">Login Now</button>
    <p class="toggle" onclick="sw()">Switch to Khaiwal Login</p>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let mode = "user";
    function sw() { 
        mode = (mode === "user") ? "admin" : "user"; 
        document.getElementById("title").innerText = (mode === "user") ? "User Login" : "Khaiwal Login";
    }

    async function login() {
        const user = document.getElementById("u").value;
        const pass = document.getElementById("p").value;
        const col = (mode === "user") ? "users" : "admins";
        const field = (mode === "user") ? "phone" : "username";

        const res = await db.collection(col).where(field, "==", user).where("password", "==", pass).get();
        if(!res.empty) {
            const d = res.docs[0].data();
            if(mode === "admin" && d.status !== "active") return alert("Aapka account abhi Pending hai!");
            localStorage.setItem("userId", res.docs[0].id);
            window.location.href = (mode === "user") ? "users.html" : "khaiwal.html";
        } else { alert("Wrong ID/Pass!"); }
    }
</script>
</body>
</html>
