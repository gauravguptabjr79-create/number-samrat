<!DOCTYPE html>
<html>
<head>
    <title>Login - Number Samrat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .toggle { margin-top: 15px; font-size: 14px; color: #666; cursor: pointer; }
    </style>
</head>
<body>

<div class="login-card">
    <h2 id="title">User Login</h2>
    <input type="text" id="phone" placeholder="Mobile Number / Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="handleLogin()">Login Now</button>
    <p class="toggle" onclick="toggleRole()" id="toggleBtn">Login as Khaiwal?</p>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = const firebaseConfig = {
  apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
  authDomain: "number-samrat.firebaseapp.com",
  databaseURL: "https://number-samrat-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "number-samrat",
  storageBucket: "number-samrat.firebasestorage.app",
  messagingSenderId: "154722781783",
  appId: "1:154722781783:web:90d8858df0197e67b3f112"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let role = "user"; // Default role

    function toggleRole() {
        if(role === "user") {
            role = "admin";
            document.getElementById("title").innerText = "Khaiwal Login";
            document.getElementById("toggleBtn").innerText = "Login as User?";
        } else {
            role = "user";
            document.getElementById("title").innerText = "User Login";
            document.getElementById("toggleBtn").innerText = "Login as Khaiwal?";
        }
    }

    async function handleLogin() {
        const input = document.getElementById("phone").value;
        const password = document.getElementById("pass").value;

        if(role === "user") {
            // User Login Logic
            const snapshot = await db.collection("users").where("phone", "==", input).where("password", "==", password).get();
            if(!snapshot.empty) {
                const userId = snapshot.docs[0].id;
                localStorage.setItem("userId", userId); // ID phone mein save ho jayegi
                window.location.href = "users.html";
            } else {
                alert("Galat Details!");
            }
        } else {
            // Khaiwal Login Logic
            const snapshot = await db.collection("admins").where("username", "==", input).where("password", "==", password).get();
            if(!snapshot.empty) {
                window.location.href = "khaiwal.html";
            } else {
                alert("Admin Access Denied!");
            }
        }
    }
</script>
</body>
</html>
