<!DOCTYPE html>
<html>
<head>
    <title>Khaiwal Dashboard - Number Samrat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial; background: #1a1a1a; color: white; padding: 20px; }
        .stats-container { display: flex; justify-content: space-around; margin-bottom: 30px; }
        .stat-box { background: #333; padding: 20px; border-radius: 10px; width: 30%; border: 1px solid #ffd700; }
        .load-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .load-table th, .load-table td { border: 1px solid #444; padding: 10px; text-align: center; }
        .load-table th { background: #ffd700; color: black; }
    </style>
</head>
<body>

    <h1>Khaiwal Stats 👑</h1>
    
    <div class="stats-container">
        <div class="stat-box">
            <h3>Total Collection</h3>
            <h2 id="totalBalance" style="color: #4caf50;">₹0</h2>
        </div>
    </div>

    <h3>Current Load (Market Wise)</h3>
    <table class="load-table">
        <thead>
            <tr>
                <th>Market</th>
                <th>Number</th>
                <th>Total Amount</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="bet-list">
            <!-- Data yahan aayega -->
        </tbody>
    </table>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Khaiwal ka Total Profit/Loss load karna
        db.collection("khaiwal").doc("stats").onSnapshot((doc) => {
            if(doc.exists) {
                document.getElementById("totalBalance").innerText = "₹" + doc.data().totalBalance;
            }
        });

        // Live Bets load karna
        db.collection("bets").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            let html = "";
            snapshot.forEach(doc => {
                const bet = doc.data();
                html += `<tr>
                    <td>${bet.gameName}</td>
                    <td>${bet.number}</td>
                    <td>₹${bet.amount}</td>
                    <td style="color:${bet.status == 'win' ? '#4caf50' : bet.status == 'loss' ? '#f44336' : '#ffd700'}">${bet.status.toUpperCase()}</td>
                </tr>`;
            });
            document.getElementById("bet-list").innerHTML = html;
        });
    </script>
</body>
</html>
