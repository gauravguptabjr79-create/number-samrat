<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Samrat - Khaiwal Portal</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; min-height: 100vh; }

        /* --- LOGIN & REGISTER BOX --- */
        #authContainer { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-card { background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 360px; text-align: center; }
        .auth-card h2 { color: #1e3799; margin-bottom: 5px; font-size: 24px; }
        .auth-card p { color: #666; font-size: 14px; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 15px; }
        .btn-main { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-login { background: #1e3799; color: white; }
        .btn-register { background: #27ae60; color: white; }
        .toggle-link { margin-top: 20px; font-size: 13px; color: #1e3799; cursor: pointer; font-weight: 500; }

        /* --- DASHBOARD (Hidden by Default) --- */
        #dashboardPage { display: none; }
        .navbar { background: #1e3799; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        
        .result-banner { background: #fff; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 25px; border-bottom: 6px solid #f39c12; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .wallet-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { padding: 20px; border-radius: 12px; color: white; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card-aaya { background: #2980b9; }
        .card-dena { background: #c0392b; }
        .card-bacha { background: #27ae60; }
        
        .table-box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        .win-tag { color: #c0392b; font-weight: bold; }
        .loss-tag { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. AUTHENTICATION SECTION (Login/Register) -->
    <div id="authContainer">
        <div class="auth-card">
            <h2 id="authTitle">Khaiwal Login</h2>
            <p id="authDesc">Apna hisab manage karne ke liye login karein</p>
            
            <input type="text" id="kID" placeholder="Khaiwal ID (Unique Name)">
            <input type="password" id="kPass" placeholder="Password">
            
            <button id="authBtn" class="btn-main btn-login" onclick="processAuth()">Log In</button>
            
            <div class="toggle-link" id="toggleAction" onclick="toggleMode()">Naya Account Banayein (Register)</div>
        </div>
    </div>

    <!-- 2. DASHBOARD SECTION (Hidden initially) -->
    <div id="dashboardPage">
        <div class="navbar">
            <div style="font-weight:bold; font-size:18px;">👑 <span id="khaiwalDisplay"></span> Panel</div>
            <button onclick="location.reload()" style="background:red; color:white; border:none; padding:6px 12px; border-radius:5px; cursor:pointer; font-weight:bold;">Logout</button>
        </div>

        <div class="container">
            <div class="result-banner">
                <p style="color:#888; font-size:12px; font-weight:bold; text-transform:uppercase;">Cloud Live Result</p>
                <h1 id="cloudRes" style="font-size:48px; color:#1e3799; margin:10px 0;">--</h1>
            </div>

            <div class="wallet-grid">
                <div class="card card-aaya"><h3>Total Collection</h3><h2 id="totalAaya">₹ 0</h2></div>
                <div class="card card-dena"><h3>Total Paying</h3><h2 id="totalDena">₹ 0</h2></div>
                <div class="card card-bacha" id="profitCard"><h3>Net Profit</h3><h2 id="netProfit">₹ 0</h2></div>
            </div>

            <div class="table-box">
                <table>
                    <thead>
                        <tr><th>User Name</th><th>Number</th><th>Points</th><th>Status</th></tr>
                    </thead>
                    <tbody id="bidList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE INITIALIZATION
        const firebaseConfig = { databaseURL: "https://number-samrat-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isLoginMode = true;

        // SWITCH BETWEEN LOGIN & REGISTER
        function toggleMode() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('authTitle');
            const desc = document.getElementById('authDesc');
            const btn = document.getElementById('authBtn');
            const toggle = document.getElementById('toggleAction');

            if (isLoginMode) {
                title.innerText = "Khaiwal Login";
                desc.innerText = "Apna hisab manage karne ke liye login karein";
                btn.innerText = "Log In";
                btn.className = "btn-main btn-login";
                toggle.innerText = "Naya Account Banayein (Register)";
            } else {
                title.innerText = "Khaiwal Registration";
                desc.innerText = "Naya Khaiwal account banayein";
                btn.innerText = "Account Banayein";
                btn.className = "btn-main btn-register";
                toggle.innerText = "Account hai? Login karein";
            }
        }

        // LOGIN OR REGISTER PROCESS
        function processAuth() {
            const id = document.getElementById('kID').value.trim();
            const pass = document.getElementById('kPass').value.trim();

            if (id === "" || pass === "") { alert("Dono field bharna zaroori hai!"); return; }

            if (isLoginMode) {
                // Check if Khaiwal exists in Database
                db.ref('khaiwals/' + id).once('value', (snap) => {
                    if (snap.exists() && snap.val().password === pass) {
                        launchDashboard(id);
                    } else { alert("Galat ID ya Password!"); }
                });
            } else {
                // Create New Khaiwal in Database
                db.ref('khaiwals/' + id).once('value', (snap) => {
                    if (snap.exists()) { alert("Ye ID pehle se li ja chuki hai!"); }
                    else {
                        db.ref('khaiwals/' + id).set({ password: pass }).then(() => {
                            alert("Registration Successful! Ab Login karein.");
                            toggleMode();
                        });
                    }
                });
            }
        }

        // SHOW DASHBOARD AND START LIVE DATA
        function launchDashboard(name) {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('dashboardPage').style.display = 'block';
            document.getElementById('khaiwalDisplay').innerText = name;

            // Start Live Listeners
            db.ref().on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // 1. Get Live Result from Cloud
                const cloudNum = data.liveResult || data.result || data.winningNumber || "";
                document.getElementById('cloudRes').innerText = cloudNum || "--";

                // 2. Process Bids
                const bids = data.bids;
                let aaya = 0, dena = 0, html = '';

                if (bids) {
                    Object.keys(bids).forEach(key => {
                        const b = bids[key];
                        const p = Number(b.points || 0);
                        aaya += p;
                        
                        let statusTag = '<span style="color:#f39c12">Bidding...</span>';
                        if (cloudNum !== "") {
                            if (b.bidNumber == cloudNum) {
                                dena += (p * 90);
                                statusTag = `<span class="win-tag">Win (Dena: ₹${p*90})</span>`;
                            } else {
                                statusTag = `<span class="loss-tag">Loss (Profit: ₹${p})</span>`;
                            }
                        }
                        html += `<tr><td>${b.username}</td><td><b>${b.bidNumber}</b></td><td>₹${p}</td><td>${statusTag}</td></tr>`;
                    });
                }
                
                document.getElementById('bidList').innerHTML = html || '<tr><td colspan="4" style="text-align:center;">No Bids Found</td></tr>';
                document.getElementById('totalAaya').innerText = '₹ ' + aaya.toLocaleString('en-IN');
                document.getElementById('totalDena').innerText = '₹ ' + dena.toLocaleString('en-IN');
                const net = aaya - dena;
                document.getElementById('netProfit').innerText = '₹ ' + net.toLocaleString('en-IN');
                document.getElementById('profitCard').style.background = net >= 0 ? '#27ae60' : '#c0392b';
            });
        }
    </script>
</body>
</html>
