<!DOCTYPE html>
<html>
<head>
    <title>Agent Dashboard - Number Samrat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: sans-serif; background: #0a0f1e; color: white; padding: 20px; text-align: center; }
        .header { background: #1e293b; padding: 15px; border-bottom: 2px solid #fbbf24; margin-bottom: 20px; }
        .stat-box { background: #1a202c; padding: 20px; border-radius: 15px; border-left: 5px solid #fbbf24; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; }
        th, td { padding: 12px; border: 1px solid #334155; }
        th { background: #fbbf24; color: black; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Agent: <span id="agentName">--</span></h2>
        <button onclick="logout()" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Logout</button>
    </div>

    <div class="stat-box">
        <small>Mera Total Collection</small>
        <h1 id="myColl" style="color:#fbbf24;">₹0</h1>
    </div>

    <h3>My Users Load</h3>
    <table>
        <thead><tr><th>Market</th><th>No.</th><th>Amount</th></tr></thead>
        <tbody id="loadList"></tbody>
    </table>

<script>
    const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const agentId = localStorage.getItem("userId");
    const role = localStorage.getItem("role");

    if(!agentId || role !== "admin") window.location.href = "index.html";

    // 1. Get Agent Phone (Username)
    db.collection("admins").doc(agentId).get().then(doc => {
        const agentPhone = doc.data().username;
        document.getElementById("agentName").innerText = agentPhone;

        // 2. Load Only THIS Agent's Bets
        db.collection("bets").where("agentId", "==", agentPhone).where("status", "==", "pending").onSnapshot(snap => {
            let total = 0;
            let grouped = {};
            snap.forEach(d => {
                const b = d.data();
                total += b.amount;
                const key = b.gameName + "-" + b.number;
                grouped[key] = (grouped[key] || 0) + b.amount;
            });
            document.getElementById("myColl").innerText = "₹" + total;
            
            let html = "";
            for(let k in grouped) {
                const [m, n] = k.split("-");
                html += <tr><td>${m}</td><td>${n}</td><td>₹${grouped[k]}</td></tr>;
            }
            document.getElementById("loadList").innerHTML = html || "<tr><td colspan='3'>No bets</td></tr>";
        });
    });

    function logout() { localStorage.clear(); window.location.href = "index.html"; }
</script>
</body>
</html>
