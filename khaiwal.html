<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Khaiwal Registration & Login</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; }
        
        .auth-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #1e3799; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-login { background: #1e3799; color: white; }
        .btn-reg { background: #27ae60; color: white; }
        .toggle-link { margin-top: 15px; font-size: 13px; color: #555; cursor: pointer; text-decoration: underline; }

        /* Dashboard (Hidden by Default) */
        #dashboardPage { display: none; width: 100%; height: 100vh; background: #f4f6f9; position: fixed; top: 0; left: 0; overflow-y: auto; }
        /* Purana Dashboard wala CSS yahan aayega (Maine short rakha hai) */
        .navbar { background: #1e3799; color: white; padding: 15px; display: flex; justify-content: space-between; }
        .card { padding: 20px; background: #fff; margin: 10px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- LOGIN / REGISTER PAGE -->
    <div id="authPage" class="auth-card">
        <h2 id="authTitle">Khaiwal Login</h2>
        <input type="text" id="khaiwalID" placeholder="Khaiwal ID (Unique)">
        <input type="password" id="khaiwalPass" placeholder="Password">
        
        <button id="mainBtn" class="btn btn-login" onclick="handleAuth()">Login Karein</button>
        
        <p class="toggle-link" id="toggleText" onclick="toggleAuth()">Naya Account Banayein (Register)</p>
    </div>

    <!-- DASHBOARD PAGE (Jo login ke baad khulega) -->
    <div id="dashboardPage">
        <div class="navbar">
            <div id="welcomeUser">👑 Khaiwal Panel</div>
            <button onclick="location.reload()" style="background:red; color:white; border:none; padding:5px 10px; border-radius:4px;">Logout</button>
        </div>
        <div style="padding: 20px; text-align: center;">
            <h1 id="liveRes" style="font-size: 50px; color: #1e3799;">--</h1>
            <p>Live Result From Cloud</p>
            <div id="walletInfo" style="display: flex; justify-content: center; gap: 20px; margin-top: 20px;">
                <div class="card">Aaya: <br><b id="totalAaya">0</b></div>
                <div class="card">Dena: <br><b id="totalDena">0</b></div>
                <div class="card">Bacha: <br><b id="netProfit">0</b></div>
            </div>
            <table style="width: 90%; margin: 20px auto; border-collapse: collapse; background: #fff;">
                <thead><tr style="background: #eee;"><th>User</th><th>No.</th><th>Pts</th><th>Status</th></tr></thead>
                <tbody id="bidTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://number-samrat-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isLoginMode = true;

        // 1. Login aur Register toggle karne ke liye
        function toggleAuth() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "Khaiwal Login" : "Khaiwal Registration";
            document.getElementById('mainBtn').innerText = isLoginMode ? "Login Karein" : "Account Banayein";
            document.getElementById('mainBtn').className = isLoginMode ? "btn btn-login" : "btn btn-reg";
            document.getElementById('toggleText').innerText = isLoginMode ? "Naya Account Banayein (Register)" : "Purana Account hai? Login karein";
        }

        // 2. Main Login/Register Logic
        function handleAuth() {
            const id = document.getElementById('khaiwalID').value.trim();
            const pass = document.getElementById('khaiwalPass').value.trim();

            if (id === "" || pass === "") { alert("Dono cheezein bharna zaroori hai!"); return; }

            if (isLoginMode) {
                // LOGIN LOGIC: Database mein check karo
                db.ref('khaiwals/' + id).once('value', (snapshot) => {
                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        if (userData.password === pass) {
                            openDashboard(id);
                        } else { alert("Galat Password!"); }
                    } else { alert("Ye Khaiwal ID nahi mili! Pehle Register karein."); }
                });
            } else {
                // REGISTER LOGIC: Database mein save karo
                db.ref('khaiwals/' + id).once('value', (snapshot) => {
                    if (snapshot.exists()) {
                        alert("Ye ID pehle se kisi ne le rakhi hai! Doosri chuney.");
                    } else {
                        db.ref('khaiwals/' + id).set({
                            password: pass,
                            regDate: new Date().toLocaleDateString()
                        }).then(() => {
                            alert("Account Ban Gaya! Ab Login karein.");
                            toggleAuth();
                        });
                    }
                });
            }
        }

        // 3. Dashboard Kholna
        function openDashboard(khaiwalName) {
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('dashboardPage').style.display = 'block';
            document.getElementById('welcomeUser').innerText = "👑 Khaiwal: " + khaiwalName;
            startLiveUpdates();
        }

        // 4. Live Updates (Purana Logic)
        function startLiveUpdates() {
            db.ref().on('value', (snapshot) => {
                const data = snapshot.val();
                if(!data) return;

                const liveNum = data.liveResult || data.result || "";
                document.getElementById('liveRes').innerText = liveNum || "Wait...";

                const bids = data.bids;
                let aaya = 0, dena = 0, html = '';

                if (bids) {
                    Object.keys(bids).forEach(key => {
                        const b = bids[key];
                        const p = Number(b.points || 0);
                        aaya += p;
                        let st = 'Pending';
                        if (liveNum !== "") {
                            if (b.bidNumber == liveNum) { dena += (p*90); st = 'Win'; } else { st = 'Loss'; }
                        }
                        html += `<tr><td>${b.username}</td><td>${b.bidNumber}</td><td>${p}</td><td>${st}</td></tr>`;
                    });
                }
                document.getElementById('bidTableBody').innerHTML = html;
                document.getElementById('totalAaya').innerText = aaya;
                document.getElementById('totalDena').innerText = dena;
                document.getElementById('netProfit').innerText = (aaya - dena);
            });
        }
    </script>
</body>
</html>
