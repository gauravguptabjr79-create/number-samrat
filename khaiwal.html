<!DOCTYPE html>
<html>
<head>
    <title>Agent Panel - Number Samrat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 15px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .box { background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; border: 1px solid #334155; text-align: center; }
        th { background: #fbbf24; color: black; }
        .manual-settle { background: #334155; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #fbbf24; }
        input { padding: 10px; border-radius: 5px; border: none; margin: 5px; width: 80px; }
        .btn { background: #fbbf24; color: black; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Khaiwal Dashboard 👑</h2>

    <div class="stat-grid">
        <div class="box">
            <small>Total Collection</small>
            <h2 id="totalColl" style="color:#fbbf24;">₹0</h2>
        </div>
        <div class="box">
            <small>Pending Bets</small>
            <h2 id="pendingCount">0</h2>
        </div>
    </div>

    <h3>Live Market Load</h3>
    <table>
        <thead><tr><th>Market</th><th>No.</th><th>Total Bet</th></tr></thead>
        <tbody id="loadTable"></tbody>
    </table>

    <div class="manual-settle">
        <h4>Backup: Manual Settle</h4>
        <input type="text" id="m-market" placeholder="GALI">
        <input type="text" id="m-num" placeholder="75">
        <button class="btn" onclick="manualSettle()">SETTLE NOW</button>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 1. Get Khaiwal Stats
    db.collection("khaiwal").doc("stats").onSnapshot(doc => {
        if(doc.exists) document.getElementById("totalColl").innerText = "₹" + doc.data().totalBalance;
    });

    // 2. Load Calculation (Smart Logic)
    db.collection("bets").where("status", "==", "pending").onSnapshot(snap => {
        document.getElementById("pendingCount").innerText = snap.size;
        let loadMap = {};
        snap.forEach(doc => {
            const b = doc.data();
            const key = `${b.gameName}-${b.number}`;
            loadMap[key] = (loadMap[key] || 0) + b.amount;
        });

        let html = "";
        for(let key in loadMap) {
            const [m, n] = key.split("-");
            html += `<tr><td>${m}</td><td>${n}</td><td style="color:#fbbf24;">₹${loadMap[key]}</td></tr>`;
        }
        document.getElementById("loadTable").innerHTML = html;
    });

    // 3. Manual Settle Function
    async function manualSettle() {
        const market = document.getElementById("m-market").value.toUpperCase();
        const winNo = document.getElementById("m-num").value;
        if(!market || !winNo) return alert("Enter details!");

        const snap = await db.collection("bets").where("gameName", "==", market).where("status", "==", "pending").get();
        if(snap.empty) return alert("No bets to settle.");

        const batch = db.batch();
        snap.forEach(doc => {
            const b = doc.data();
            const uRef = db.collection("users").doc(b.userId);
            const sRef = db.collection("khaiwal").doc("stats");
            if(b.number === winNo) {
                batch.update(uRef, { wallet: firebase.firestore.FieldValue.increment(b.amount * 90) });
                batch.update(sRef, { totalBalance: firebase.firestore.FieldValue.increment(-(b.amount * 90)) });
                batch.update(doc.ref, { status: "win" });
            } else {
                batch.update(sRef, { totalBalance: firebase.firestore.FieldValue.increment(b.amount) });
                batch.update(doc.ref, { status: "loss" });
            }
        });
        await batch.commit();
        alert("Settle Done!");
    }
</script>
</body>
</html>
