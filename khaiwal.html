<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khaiwal Master - Number Samrat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: sans-serif; background: #0a0f1e; color: white; margin: 0; padding: 0; }
        .header { background: #1e293b; padding: 20px; border-bottom: 2px solid #fbbf24; text-align: center; position: relative; }
        .logout-btn { position: absolute; right: 10px; top: 20px; background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        .container { padding: 15px; max-width: 800px; margin: 0 auto; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #1a202c; padding: 20px; border-radius: 15px; border-left: 5px solid #fbbf24; }
        .stat-card p { margin: 5px 0 0; font-size: 1.5rem; font-weight: bold; color: #fbbf24; }

        .section-box { background: #1e293b; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .section-box h2 { margin-top: 0; font-size: 1.1rem; color: #fbbf24; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th { text-align: left; color: #94a3b8; padding: 10px; border-bottom: 1px solid #334155; }
        td { padding: 12px 10px; border-bottom: 1px solid #334155; }
        
        .badge { background: #10b981; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <button class="logout-btn" onclick="logout()">Logout</button>
        <h2 style="margin:0;">KHAIWAL DASHBOARD 👑</h2>
    </div>

    <div class="container">
        <!-- 1. Stats -->
        <div class="stat-grid">
            <div class="stat-card"><h3>Total Collection</h3><p id="totalBalance">₹0</p></div>
            <div class="stat-card"><h3>Active Bets</h3><p id="pendingCount">0</p></div>
        </div>

        <!-- 2. LIVE RECHARGE LOG (ASLI PAISA) -->
        <div class="section-box">
            <h2>Live Recharges (Automatic)</h2>
            <table>
                <thead><tr><th>User ID</th><th>Amount</th><th>Time</th></tr></thead>
                <tbody id="recharge-list"></tbody>
            </table>
        </div>

        <!-- 3. MARKET LOAD -->
        <div class="section-box">
            <h2>Live Market Load</h2>
            <table>
                <thead><tr><th>Market</th><th>No.</th><th>Total Load</th></tr></thead>
                <tbody id="load-list"></tbody>
            </table>
        </div>

        <!-- 4. MANUAL CONTROL -->
        <div class="section-box" style="border: 1px dashed #ef4444;">
            <h3 style="color:#ef4444; margin:0;">Emergency Manual Settle</h3>
            <input type="text" id="m-market" placeholder="GALI" style="padding:10px; border-radius:5px; border:none; width:70px; margin:5px;">
            <input type="text" id="m-num" placeholder="75" maxlength="2" style="padding:10px; border-radius:5px; border:none; width:50px; margin:5px;">
            <button onclick="emergencySettle()" style="background:#ef4444; color:white; border:none; padding:10px; border-radius:5px; font-weight:bold; cursor:pointer;">SETTLE</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Check Admin
        if(localStorage.getItem("role") !== "admin") { window.location.href="login.html"; }

        // 1. Load Total Balance
        db.collection("khaiwal").doc("stats").onSnapshot(doc => { if(doc.exists) document.getElementById("totalBalance").innerText = "₹" + doc.data().totalBalance; });

        // 2. Load RECHARGE HISTORY (Live)
        db.collection("recharges").orderBy("timestamp", "desc").limit(5).onSnapshot(snap => {
            let html = "";
            snap.forEach(doc => {
                const r = doc.data();
                const time = r.timestamp ? new Date(r.timestamp.seconds * 1000).toLocaleTimeString() : "...";
                html += <tr><td>${r.userId.substring(0,6)}...</td><td style="color:#10b981;">+₹${r.amount}</td><td>${time}</td></tr>;
            });
            document.getElementById("recharge-list").innerHTML = html || "<tr><td colspan='3'>No recharges today</td></tr>";
        });

        // 3. Load MARKET LOAD
        db.collection("bets").where("status", "==", "pending").onSnapshot(snap => {
            document.getElementById("pendingCount").innerText = snap.size;
            let grouped = {};
            snap.forEach(doc => {
                const b = doc.data();
                const key = b.gameName + "-" + b.number;
                grouped[key] = (grouped[key] || 0) + b.amount;
            });
            let html = "";
            for(let k in grouped) {
                const [m, n] = k.split("-");
                html += <tr><td>${m}</td><td><b style="color:#fbbf24;">${n}</b></td><td>₹${grouped[k]}</td></tr>;
            }
            document.getElementById("load-list").innerHTML = html || "<tr><td colspan='3'>No bets</td></tr>";
        });

        async function emergencySettle() { /* Purana logic same rahega */ }
        function logout() { localStorage.clear(); window.location.href = "login.html"; }
    </script>
</body>
</html>
