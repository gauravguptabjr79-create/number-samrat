<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Registration - Number Samrat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h2 { color: #fbbf24; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #fbbf24; color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .back-link { margin-top: 15px; font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h2>💼 Agent Apply</h2>
    <p style="font-size: 12px; color: #94a3b8;">Khaiwal banne ke liye apply karein.</p>
    
    <input type="text" id="a-name" placeholder="Apna Naam">
    <input type="text" id="a-phone" placeholder="Mobile Number (Username)">
    <input type="password" id="a-pass" placeholder="Password Set Karein">
    
    <button onclick="applyNow()">APPLY FOR AGENT</button>
    
    <div class="back-link">
        <a href="login_agent.html" style="color: #fbbf24;">Pehle se Agent hain? Login</a>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function applyNow() {
        const n = document.getElementById("a-name").value.trim();
        const p = document.getElementById("a-phone").value.trim();
        const pw = document.getElementById("a-pass").value.trim();

        if(!n || !p || !pw) return alert("Bhai saari details bharo!");

        // Check agar ye phone pehle se hai
        const res = await db.collection("admins").where("username", "==", p).get();
        if(!res.empty) return alert("Ye number pehle se register hai!");

        // Admins table mein PENDING status ke saath save karo
        await db.collection("admins").add({
            name: n,
            username: p,
            password: pw,
            status: "pending", // Aap isey master.html se active karoge
            role: "admin",
            totalBalance: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("Application Bheji Gayi! Master Admin (Gaurav Bhai) approve karenge tab login hoga.");
        window.location.href = "login_agent.html";
    }
</script>
</body>
</html>
