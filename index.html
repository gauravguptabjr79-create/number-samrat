<!DOCTYPE html>
<html>
<head>
    <title>Number Samrat - Final Shield v10.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { background: #000; color: #ffd700; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .main-box { border: 3px solid #ffd700; background: #111; padding: 30px; border-radius: 20px; display: inline-block; width: 95%; max-width: 500px; box-shadow: 0 0 20px #ffd700; }
        .win-number { font-size: 80px; color: #fff; text-shadow: 0 0 15px #ffd700; margin: 15px 0; font-weight: bold; }
        .terminal { background: #000; color: #ffd700; text-align: left; padding: 15px; font-size: 12px; height: 180px; overflow-y: auto; margin-top: 20px; border: 1px solid #333; }
        .status-btn { background: #ffd700; color: #000; padding: 5px 15px; font-weight: bold; border-radius: 5px; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="main-box">
        <h1>SAMRAT ENGINE v10.0 🏆</h1>
        <div class="status-btn">AUTO-RECOVERY: ACTIVE ✅</div>
        <hr style="border: 0.5px solid #333;">
        
        <p style="color: #888;">LATEST LIVE RESULT:</p>
        <div id="win-number" class="win-number">--</div>
        <div id="market-name" style="font-size: 24px; color: #00e5ff; font-weight: bold;">SCANNING...</div>

        <div id="logs" class="terminal">System Starting Final Shield...</div>
    </div>

    <script>
        // --- APKI FIREBASE CONFIG (Sahi hai) ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function addLog(m) {
            const l = document.getElementById('logs');
            l.innerHTML += "> " + m + "<br>";
            l.scrollTop = l.scrollHeight;
        }

        async function startEngine() {
            addLog("Result scan shuru ho raha hai...");
            const target = "https://numbersamra-app-2.ai-st.workers.dev/get-result";
            
            // --- PEHLA RASTA (Codetabs Proxy) ---
            try {
                addLog("Trying Route 1...");
                const response = await fetch("https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(target));
                const data = await response.json();
                if(data && data.number) {
                    processData(data);
                    return; // Jeet gaye!
                }
            } catch (err) {
                addLog("Route 1 Failed. Trying Route 2...");
            }

            // --- DUSRA RASTA (CORSProxy.io) ---
            try {
                addLog("Trying Route 2...");
                const response = await fetch("https://corsproxy.io/?" + encodeURIComponent(target));
                const data = await response.json();
                if(data && data.number) {
                    processData(data);
                    return;
                }
            } catch (err) {
                addLog("All routes blocked. Checking again in 30s...");
            }
        }

        function processData(data) {
            document.getElementById('win-number').innerText = data.number;
            document.getElementById('market-name').innerText = "MARKET: " + data.game.toUpperCase();
            addLog("SUCCESS: Result Mil Gaya (" + data.number + ")");
            doSettlement(data.number, data.game);
        }

        async function doSettlement(winNo, market) {
            addLog("Database mein bets check kar rahe hain...");
            const snapshot = await db.collection("bets").where("gameName", "==", market).where("status", "==", "pending").get();

            if (snapshot.empty) {
                addLog("Is market ki koi nai bet nahi hai.");
                return;
            }

            const batch = db.batch();
            addLog(snapshot.size + " Bets mili hain. Hisaab ho raha hai...");

            snapshot.forEach(doc => {
                const b = doc.data();
                const uRef = db.collection("users").doc(b.userId);
                const kRef = db.collection("khaiwal").doc("stats");

                if (b.number === winNo) {
                    batch.update(uRef, { wallet: firebase.firestore.FieldValue.increment(parseInt(b.amount) * 90) });
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(-(parseInt(b.amount) * 90)) });
                    batch.update(doc.ref, { status: "win" });
                    addLog("Winner: " + b.userId);
                } else {
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(parseInt(b.amount)) });
                    batch.update(doc.ref, { status: "loss" });
                }
            });

            await batch.commit();
            addLog("HISAAB POORA HO GAYA! ✅");
        }

        setInterval(startEngine, 30000);
        startEngine();

    </script>
</body>
</html>
