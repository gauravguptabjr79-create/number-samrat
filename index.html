[14:02, 06/08/2026] gauravguptabjr: <!DOCTYPE html>
<html>
<head>
    <title>Number Samrat - Fix v16.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { background: #000; color: #ffd700; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .engine-card { border: 3px solid #ffd700; background: #111; padding: 30px; border-radius: 20px; display: inline-block; width: 95%; max-width: 500px; box-shadow: 0 0 20px #ffd700; }
        .win-no { font-size: 80px; color: #fff; text-shadow: 0 0 15px #ffd700; margin: 15px 0; font-weight: bold; }
        .log-terminal { background: #000; color: #00ff00; text-align: left; padding: 12px; font-size: 11px; height: 180px; overflow-y: auto; margin-top: 20px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="engine-card">
        <h1>SAMRAT ENGINE v16.0 🏆</h1>
        <div id="status" style="color: #00ff00; font-weight: bold;">[ ENGINE STATUS: ACTIVE ]</div>
        <hr style="border: 0.5px solid #333;">
        
        <p style="color: #888; margin: 0;">LATEST LIVE RESULT:</p>
        <div id="win-number" class="win-no">--</div>
        <div id="market-name" style="font-size: 22px; color: #00e5ff; font-weight: bold;">SCANNING...</div>

        <div id="logs" class="log-terminal">Engine starting with Line 58 & 71 fix...</div>
    </div>

    <script>
        // --- FIREBASE CONFIG (No Change) ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function addLog(m) {
            const logs = document.getElementById('logs');
            logs.innerHTML += "> " + m + "<br>";
            logs.scrollTop = logs.scrollHeight;
        }

        const TARGET_URL = "https://numbersamra-app-2.ai.studio/get-result";

        async function fetchResult() {
            addLog("Market scan shuru...");
            
            try {
                // --- LINE 58: FIXED FETCH LOGIC ---
                const response = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(TARGET_URL + "?t=" + Date.now()));
                const raw = await response.json();
                const data = JSON.parse(raw.contents);
                
                if(data && data.number) {
                    document.getElementById('win-number').innerText = data.number;
                    document.getElementById('market-name').innerText = "MARKET: " + data.game.toUpperCase();
                    addLog("SUCCESS: Result mil gaya (" + data.number + ")");
                    
                    // Wallet automatic settlement
                    processWallets(data.number, data.game);
                } else {
                    addLog("Status: Result abhi update nahi hua.");
                }
            } catch (err) {
                addLog("Wait: API response ka intezar hai...");
            }
        }

        async function processWallets(winNo, market) {
            addLog("Database mein bets check kar rahe hain...");
            const snapshot = await db.collection("bets").where("gameName", "==", market).where("status", "==", "pending").get();

            if (snapshot.empty) {
                addLog("Is market ki koi nai bet nahi mili.");
                return;
            }

            const batch = db.batch();
            addLog(snapshot.size + " bets mili hain. Processing...");

            // --- LINE 71: FIXED SNAPSHOT LOOP ---
            snapshot.forEach((doc) => {
                const b = doc.data();
                const uRef = db.collection("users").doc(b.userId);
                const kRef = db.collection("khaiwal").doc("stats");
                const amt = parseInt(b.amount);

                if (b.number === winNo) {
                    // Winner Update
                    batch.update(uRef, { wallet: firebase.firestore.FieldValue.increment(amt * 90) });
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(-(amt * 90)) });
                    batch.update(doc.ref, { status: "win" });
                    addLog("Winner Updated: " + b.userId);
                } else {
                    // Loser Update
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(amt) });
                    batch.update(doc.ref, { status: "loss" });
                }
            });

            await batch.commit();
            addLog("HISAAB DONE! Wallets updated. ✅");
        }

        // Har 30 second mein check karega
        setInterval(fetchResult, 30000);
        fetchResult();

    </script>
</body>
</html>
