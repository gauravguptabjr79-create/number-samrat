<!DOCTYPE html>
<html>
<head>
    <title>Number Samrat - Red Force v8.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        /* Agar screen LAL (Red) nahi hui, toh samajho update nahi hua */
        body { background: #1a0000; color: #ff3333; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .red-card { border: 4px solid #ff0000; background: #000; padding: 30px; border-radius: 20px; display: inline-block; width: 95%; max-width: 500px; box-shadow: 0 0 30px #ff0000; }
        .win-display { font-size: 80px; color: #fff; text-shadow: 0 0 20px #ff0000; margin: 15px 0; font-weight: 900; }
        .terminal { background: #110000; color: #ff5555; text-align: left; padding: 15px; font-size: 11px; height: 180px; overflow-y: auto; margin-top: 25px; border: 1px solid #ff3333; font-family: monospace; }
        .status { background: #ff0000; color: #fff; padding: 5px 15px; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="red-card">
        <h1 style="margin: 0; letter-spacing: 5px;">FORCE ENGINE v8.0 🔴</h1>
        <div style="margin: 15px 0;"><span class="status">ENGINE: RUNNING</span></div>
        <hr style="border: 0.5px solid #ff3333;">
        
        <p style="color: #888; margin: 0;">LATEST RESULT:</p>
        <div id="win-number" class="win-display">--</div>
        <div id="market-name" style="font-size: 24px; font-weight: bold; color: #fff;">SCANNING...</div>

        <div id="logs" class="terminal">Red Force Booting...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function addLog(m) {
            const l = document.getElementById('logs');
            l.innerHTML += "> " + m + "<br>";
            l.scrollTop = l.scrollHeight;
        }

        async function engineRun() {
            addLog("Result nikalne ki koshish (Final Method)...");
            
            // Bhai, ye aapka asli URL hai jo 100% data dega
            const targetUrl = "https://numbersamra-app-2.ai-st.workers.dev/get-result";
            const proxy = "https://api.allorigins.win/get?url=" + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(proxy);
                const raw = await response.json();
                const data = JSON.parse(raw.contents);
                
                if(data && data.number) {
                    document.getElementById('win-number').innerText = data.number;
                    document.getElementById('market-name').innerText = "MARKET: " + data.game.toUpperCase();
                    addLog("SUCCESS: Result Mil Gaya! " + data.number);
                    
                    // Wallet Update Logic
                    settleWallets(data.number, data.game);
                } else {
                    addLog("STATUS: Intezar... (Naya result nahi aaya)");
                }
            } catch (err) {
                addLog("ERROR: API link abhi data nahi de rahi hai.");
            }
        }

        async function settleWallets(winNo, market) {
            const snapshot = await db.collection("bets").where("gameName", "==", market).where("status", "==", "pending").get();
            if (snapshot.empty) { addLog("Koi nai bet nahi mili."); return; }

            const batch = db.batch();
            addLog(snapshot.size + " Bets ka hisaab ho raha hai...");

            snapshot.forEach(doc => {
                const b = doc.data();
                const uRef = db.collection("users").doc(b.userId);
                const kRef = db.collection("khaiwal").doc("stats");
                if (b.number === winNo) {
                    batch.update(uRef, { wallet: firebase.firestore.FieldValue.increment(b.amount * 90) });
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(-(b.amount * 90)) });
                    batch.update(doc.ref, { status: "win" });
                } else {
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(b.amount) });
                    batch.update(doc.ref, { status: "loss" });
                }
            });
            await batch.commit();
            addLog("WALLETS UPDATED! ✅");
        }

        setInterval(engineRun, 30000);
        engineRun();
    </script>
</body>
</html>
