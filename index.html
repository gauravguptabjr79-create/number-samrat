<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khaiwal Dashboard - Number Samrat</title>
    
    <!-- Firebase Engine -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { font-family: sans-serif; background: #eef2f3; padding: 20px; text-align: center; }
        .box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { width: 45%; padding: 10px; margin: 5px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
        .btn-add { background: #28a745; }
        .btn-sub { background: #dc3545; }
        #status { margin-top: 15px; color: blue; font-weight: bold; }
        .user-info { margin-bottom: 20px; padding: 10px; border-bottom: 2px solid #eee; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Khaiwal Dashboard</h2>
        <p>Number Samrat App</p>

        <div class="user-info">
            <input type="text" id="userId" placeholder="User Name (e.g. Rahul)">
            <p>Current Balance: <span id="currentBal">0</span></p>
        </div>

        <input type="number" id="points" placeholder="Enter Points">
        <br>
        <button class="btn-add" onclick="updatePoints('ADD')">Add Points (+)</button>
        <button class="btn-sub" onclick="updatePoints('SUB')">Sub Points (-)</button>

        <div id="status">Ready...</div>
    </div>

    <script>
        // Aapki Firebase Settings (Jo photo mein thi)
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            databaseURL: "https://number-samrat-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7bb136ce1c34a11b3f112"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Points Update karne ka function
        function updatePoints(type) {
            const uId = document.getElementById('userId').value;
            const pts = document.getElementById('points').value;
            const status = document.getElementById('status');

            if (!uId || !pts) {
                alert("Pahle Name aur Points bharo!");
                return;
            }

            status.innerText = "Updating...";

            const userRef = db.ref('users/' + uId);
            
            userRef.transaction((currentData) => {
                let currentBal = (currentData && currentData.wallet_balance) ? currentData.wallet_balance : 0;
                
                if (type === 'ADD') {
                    return { wallet_balance: parseFloat(currentBal) + parseFloat(pts) };
                } else {
                    return { wallet_balance: parseFloat(currentBal) - parseFloat(pts) };
                }
            }).then(() => {
                status.innerText = "Success! Points Updated.";
                document.getElementById('points').value = "";
                showBalance(uId);
            }).catch((err) => {
                status.innerText = "Error: " + err.message;
            });
        }

        // Live Balance dikhane ke liye
        function showBalance(name) {
            db.ref('users/' + name).on('value', (snap) => {
                if(snap.exists()){
                    document.getElementById('currentBal').innerText = snap.val().wallet_balance;
                }
            });
        }

        // Jab name type karein to balance dikhaye
        document.getElementById('userId').oninput = function() {
            showBalance(this.value);
        };
    </script>
</body>
</html>
