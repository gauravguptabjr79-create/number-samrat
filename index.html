<script>
    // --- SAFE AUTO-WINNER LOGIC ---
    let isProcessing = false;

    async function fetchLiveNumber() {
        if (isProcessing) return; // Agar pehle se winner check ho raha hai to ruko

        const targetUrl = "https://numbersamra-app-2.ai.studio";
        const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(targetUrl);

        try {
            const response = await fetch(proxyUrl);
            const data = await response.json();
            const match = data.contents.match(/\b\d{2}\b/); 
            
            if (match) {
                const newNumber = match[0];
                
                // Check karo ki kya ye number Firebase mein pehle se hai?
                db.ref('live_result/current_number').once('value', (snap) => {
                    const oldNumber = snap.val();
                    
                    if (newNumber !== oldNumber) {
                        isProcessing = true;
                        console.log("Naya Result Aaya: " + newNumber);
                        
                        // 1. Database mein naya number update karo
                        db.ref('live_result/current_number').set(newNumber);
                        
                        // 2. Winners ko dhoondo aur sirf unhe paise do
                        processWinners(newNumber);
                    }
                });
            }
        } catch (err) { console.log("System Checking..."); }
    }

    function processWinners(winningNum) {
        db.ref('bids').once('value', (snapshot) => {
            if (!snapshot.exists()) {
                isProcessing = false;
                return;
            }

            snapshot.forEach((userSnap) => {
                const userName = userSnap.key;
                const userBids = userSnap.val();

                Object.keys(userBids).forEach((bidId) => {
                    const bid = userBids[bidId];
                    if (bid.number === winningNum) {
                        const winAmt = parseFloat(bid.amount) * 90;
                        // Winner ke wallet mein paise add karna
                        db.ref('users/' + userName + '/wallet_balance').transaction((bal) => (bal || 0) + winAmt);
                    }
                });
            });

            // Sabse Important: Bids delete karna taaki dubara payout na ho
            db.ref('bids').remove().then(() => {
                isProcessing = false;
                alert("Result Out: " + winningNum + ". Winners Paid!");
            });
        });
    }

    setInterval(fetchLiveNumber, 40000); // Har 40 second mein check karo
</script>
