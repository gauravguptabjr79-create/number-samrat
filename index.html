<!DOCTYPE html>
<html>
<head>
    <title>Number Samrat - Ultimate Bypass v11.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .main-box { border: 3px solid #00ff00; background: #0a0a0a; padding: 30px; border-radius: 20px; display: inline-block; width: 95%; max-width: 500px; box-shadow: 0 0 25px #00ff00; }
        .win-number { font-size: 80px; color: #fff; text-shadow: 0 0 15px #00ff00; margin: 15px 0; font-weight: bold; }
        .terminal { background: #001100; color: #00ff00; text-align: left; padding: 15px; font-size: 11px; height: 180px; overflow-y: auto; margin-top: 20px; border: 1px solid #004400; }
        .status-tag { border: 1px solid #00ff00; padding: 5px 15px; font-weight: bold; margin-bottom: 20px; display: inline-block; background: #003300; }
    </style>
</head>
<body>

    <div class="main-box">
        <h1 style="letter-spacing: 5px;">ENGINE v11.0 🚀</h1>
        <div class="status-tag">CLOUDFLARE BYPASS: ACTIVE ✅</div>
        <hr style="border: 0.5px solid #004400;">
        
        <p style="color: #888;">LATEST LIVE RESULT:</p>
        <div id="win-number" class="win-number">--</div>
        <div id="market-name" style="font-size: 24px; color: #00e5ff; font-weight: bold;">SCANNING...</div>

        <div id="logs" class="terminal">System Initializing...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function addLog(m) {
            const l = document.getElementById('logs');
            l.innerHTML += "> " + m + "<br>";
            l.scrollTop = l.scrollHeight;
        }

        async function startEngine() {
            addLog("Result scan shuru (High Security Bypass)...");
            
            // Bhai, ye aapka target hai
            const target = "https://numbersamra-app-2.ai-st.workers.dev/get-result";
            const timeStamp = new Date().getTime(); // Har baar naya request
            
            // --- PEHLA RASTA (ThingProxy - Very Powerful) ---
            try {
                addLog("Trying Route 1 (ThingProxy)...");
                const response = await fetch("https://thingproxy.freeboard.io/fetch/" + target + "?t=" + timeStamp);
                const data = await response.json();
                if(data && data.number) {
                    updateSystem(data);
                    return;
                }
            } catch (err) {
                addLog("Route 1 Blocked. Trying Route 2...");
            }

            // --- DUSRA RASTA (AllOrigins with Cache-Buster) ---
            try {
                addLog("Trying Route 2 (AllOrigins)...");
                const response = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(target + "?t=" + timeStamp));
                const res = await response.json();
                const data = JSON.parse(res.contents);
                if(data && data.number) {
                    updateSystem(data);
                    return;
                }
            } catch (err) {
                addLog("System Wait: Result abhi site par update nahi hua.");
            }
        }

        function updateSystem(data) {
            document.getElementById('win-number').innerText = data.number;
            document.getElementById('market-name').innerText = "MARKET: " + data.game.toUpperCase();
            addLog("SUCCESS: Live Result Found (" + data.number + ")");
            doSettlement(data.number, data.game);
        }

        async function doSettlement(winNo, market) {
            addLog("Database mein bets check ho rahi hain...");
            const snapshot = await db.collection("bets").where("gameName", "==", market).where("status", "==", "pending").get();

            if (snapshot.empty) {
                addLog("Koi nai bet nahi mili.");
                return;
            }

            const batch = db.batch();
            addLog(snapshot.size + " Bets ka hisaab ho raha hai...");

            snapshot.forEach(doc => {
                const b = doc.data();
                const uRef = db.collection("users").doc(b.userId);
                const kRef = db.collection("khaiwal").doc("stats");

                if (b.number === winNo) {
                    batch.update(uRef, { wallet: firebase.firestore.FieldValue.increment(parseInt(b.amount) * 90) });
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(-(parseInt(b.amount) * 90)) });
                    batch.update(doc.ref, { status: "win" });
                    addLog("WINNER: " + b.userId);
                } else {
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(parseInt(b.amount)) });
                    batch.update(doc.ref, { status: "loss" });
                }
            });

            await batch.commit();
            addLog("HISAAB DONE! ✅");
        }

        setInterval(startEngine, 30000);
        startEngine();

    </script>
</body>
</html>
