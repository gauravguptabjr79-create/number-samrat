<!DOCTYPE html>
<html>
<head>
    <title>Number Samrat - Debug Mode</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { border: 2px solid #333; padding: 20px; border-radius: 10px; background: #1e1e1e; display: inline-block; width: 90%; max-width: 400px; }
        .error-log { color: #ff5252; background: #000; padding: 10px; margin-top: 20px; text-align: left; font-size: 12px; border-left: 4px solid red; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Number Samrat Engine</h2>
        <p id="status" style="color: orange;">Checking Connection...</p>
        <hr>
        <p>Live Result: <b id="win-no" style="color: #4caf50; font-size: 24px;">--</b></p>
        <p id="game-name" style="color: gray;">Waiting...</p>
        
        <div id="error-display" class="error-log">Logs will appear here...</div>
    </div>

    <script>
        // Apki Real Config
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        function showLog(msg) {
            document.getElementById('error-display').innerHTML += "<br>> " + msg;
        }

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            document.getElementById('status').innerText = "Firebase Connected! ✅";
            showLog("Firebase initialized successfully.");

            async function checkEngine() {
                showLog("Fetching result from API...");
                try {
                    const r = await fetch("https://numbersamrat-app-2.ai-st.workers.dev/get-result");
                    const data = await r.json();
                    
                    if(data.number) {
                        document.getElementById('win-no').innerText = data.number;
                        document.getElementById('game-name').innerText = "Game: " + data.game;
                        showLog("Result Found: " + data.number + ". Checking for Winners...");
                        
                        // Yahan se winner update logic shuru hota hai
                        processWinners(data.number, data.game);
                    }
                } catch(e) {
                    showLog("API Error: " + e.message);
                }
            }

            async function processWinners(num, game) {
                const snapshot = await db.collection("bets").where("gameName", "==", game).where("status", "==", "pending").get();
                if(snapshot.empty) {
                    showLog("No pending bets to process.");
                } else {
                    showLog("Found " + snapshot.size + " bets. Updating wallets...");
                    // ... (Wallet update logic)
                }
            }

            setInterval(checkEngine, 30000);
            checkEngine();

        } catch (err) {
            showLog("CRITICAL ERROR: " + err.message);
            document.getElementById('status').innerText = "Connection Failed! ❌";
        }
    </script>
</body>
</html>
