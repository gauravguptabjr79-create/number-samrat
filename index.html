<!DOCTYPE html>
<html>
<head>
    <title>Number Samrat - Golden Engine v7.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        /* Golden Theme - Victory Version */
        body { background: #0a0a00; color: #ffd700; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 20px; }
        .golden-card { border: 3px solid #ffd700; background: #1a1a00; padding: 30px; border-radius: 25px; display: inline-block; width: 95%; max-width: 500px; box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); }
        .win-display { font-size: 80px; color: #fff; text-shadow: 0 0 20px #ffd700; margin: 15px 0; font-weight: 900; background: rgba(0,0,0,0.3); border-radius: 15px; }
        .terminal { background: #000; color: #ffd700; text-align: left; padding: 12px; font-size: 11px; height: 180px; overflow-y: auto; margin-top: 25px; border: 1px solid #ffd700; border-radius: 10px; font-family: monospace; }
        .badge { background: #ffd700; color: #000; padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

    <div class="golden-card">
        <h1 style="margin: 0; letter-spacing: 3px;">SAMRAT v7.0 🏆</h1>
        <div style="margin: 15px 0;"><span class="badge">SYSTEM: ONLINE & MONITORING</span></div>
        <hr style="border: 0.5px solid #ffd700; opacity: 0.3;">
        
        <p style="color: #aaa; margin: 0; font-size: 14px;">LIVE RESULT:</p>
        <div id="win-number" class="win-display">--</div>
        <div id="market-name" style="font-size: 24px; font-weight: bold; color: #ffd700;">SCANNING...</div>

        <div id="logs" class="terminal">System Booting...</div>
    </div>

    <script>
        // --- FIREBASE CONFIG (No Change) ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function addLog(m) {
            const l = document.getElementById('logs');
            l.innerHTML += "> " + m + "<br>";
            l.scrollTop = l.scrollHeight;
        }

        async function engineRun() {
            addLog("Market result check karne ki koshish...");
            
            // Bhai, ye hai wo URL jo aapne bataya tha
            const targetUrl = "https://numbersamra-app-2.ai.studio/get-result";
            
            // Naya Proxy - Zyada Taqatwar
            const proxy = "https://api.codetabs.com/v1/proxy?quest=";

            try {
                const response = await fetch(proxy + encodeURIComponent(targetUrl));
                const data = await response.json();
                
                if(data && data.number) {
                    document.getElementById('win-number').innerText = data.number;
                    document.getElementById('market-name').innerText = "MARKET: " + data.game.toUpperCase();
                    addLog("SUCCESS: Result Mil Gaya (" + data.number + ")");
                    
                    // Wallet Update Logic
                    startAutomaticSettlement(data.number, data.game);
                } else {
                    addLog("INFO: Site par result abhi update nahi hua.");
                }
            } catch (err) {
                addLog("ERROR: Data tak pahunch nahi pa rahe. Intezar karein...");
            }
        }

        async function startAutomaticSettlement(winNo, market) {
            addLog("Database mein bets check ho rahi hain...");
            const snapshot = await db.collection("bets").where("gameName", "==", market).where("status", "==", "pending").get();

            if (snapshot.empty) {
                addLog("Is market ki koi nai bet nahi mili.");
                return;
            }

            const batch = db.batch();
            addLog(snapshot.size + " Bets mili hain. Hisaab ho raha hai...");

            snapshot.forEach(doc => {
                const b = doc.data();
                const uRef = db.collection("users").doc(b.userId);
                const kRef = db.collection("khaiwal").doc("stats");

                if (b.number === winNo) {
                    batch.update(uRef, { wallet: firebase.firestore.FieldValue.increment(b.amount * 90) });
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(-(b.amount * 90)) });
                    batch.update(doc.ref, { status: "win" });
                    addLog("Winner Updated: " + b.userId);
                } else {
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(b.amount) });
                    batch.update(doc.ref, { status: "loss" });
                }
            });

            await batch.commit();
            addLog("HISAAB POORA HO GAYA! ✅");
        }

        setInterval(engineRun, 30000); // Har 30 sec mein scan
        engineRun();

    </script>
</body>
</html>
