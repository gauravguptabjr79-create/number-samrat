<!DOCTYPE html>
<html>
<head>
    <title>Number Samrat - Blue Engine v6.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        /* Is baar blue theme hai taaki confirm ho jaye ki update hua hai */
        body { background: #00051a; color: #00d2ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; }
        .engine-card { border: 3px solid #00d2ff; background: #000a2e; padding: 30px; border-radius: 25px; display: inline-block; width: 95%; max-width: 500px; box-shadow: 0 0 25px #00d2ff; }
        .status-badge { background: #00d2ff; color: #000; padding: 5px 15px; border-radius: 50px; font-weight: bold; font-size: 14px; }
        .win-display { font-size: 70px; color: #fff; text-shadow: 0 0 15px #00d2ff; margin: 20px 0; font-weight: 800; }
        .terminal { background: #000; color: #00d2ff; text-align: left; padding: 12px; font-size: 11px; height: 180px; overflow-y: auto; margin-top: 25px; border: 1px solid #00d2ff; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="engine-card">
        <h1 style="margin: 0; letter-spacing: 2px;">SAMRAT v6.0 🔵</h1>
        <div style="margin: 15px 0;"><span class="status-badge">ENGINE STATUS: ACTIVE</span></div>
        <hr style="border: 0.5px solid #00d2ff; opacity: 0.3;">
        
        <p style="color: #88c; margin: 0; font-size: 14px;">LIVE MARKET NUMBER:</p>
        <div id="win-no" class="win-display">--</div>
        <div id="market-name" style="font-size: 24px; font-weight: bold; color: #fff;">SCANNING...</div>

        <div id="logs" class="terminal">System Booting...</div>
    </div>

    <script>
        // --- APKI FIREBASE ID (SAME) ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function addLog(m) {
            const l = document.getElementById('logs');
            l.innerHTML += "> " + m + "<br>";
            l.scrollTop = l.scrollHeight;
        }

        async function engineRun() {
            addLog("Market result check karne ki koshish...");
            
            // Bhai, ye hai wo URL jo aapne bataya tha
            const targetUrl = "https://numbersamra-app-2.ai.studio/get-result";
            const proxy = "https://api.allorigins.win/get?url=" + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(proxy);
                if(!response.ok) throw new Error("Server Response Error");
                const json = await response.json();
                const data = JSON.parse(json.contents);
                
                if(data && data.number) {
                    document.getElementById('win-no').innerText = data.number;
                    document.getElementById('market-name').innerText = "MARKET: " + data.game.toUpperCase();
                    addLog("SUCCESS: Result Mil Gaya (" + data.number + ")");
                    
                    // Wallet Update Logic
                    autoSettle(data.number, data.game);
                } else {
                    addLog("INFO: Abhi tak naya result nahi aaya.");
                }
            } catch (err) {
                addLog("ERROR: Data nahi mil raha. URL check karo ya intezar karo.");
            }
        }

        async function autoSettle(winNo, market) {
            addLog("Database scan shuru...");
            const snap = await db.collection("bets").where("gameName", "==", market).where("status", "==", "pending").get();

            if (snap.empty) {
                addLog("Koi nai bet nahi mili.");
                return;
            }

            const batch = db.batch();
            addLog(snap.size + " Bets ka hisaab ho raha hai...");

            snap.forEach(doc => {
                const b = doc.data();
                const uRef = db.collection("users").doc(b.userId);
                const kRef = db.collection("khaiwal").doc("stats");

                if (b.number === winNo) {
                    batch.update(uRef, { wallet: firebase.firestore.FieldValue.increment(b.amount * 90) });
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(-(b.amount * 90)) });
                    batch.update(doc.ref, { status: "win" });
                    addLog("WINNER Processed: " + b.userId);
                } else {
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(b.amount) });
                    batch.update(doc.ref, { status: "loss" });
                }
            });

            await batch.commit();
            addLog("WALLET UPDATE DONE! ✅");
        }

        setInterval(engineRun, 30000); // Har 30 sec mein check
        engineRun();

    </script>
</body>
</html>
