<!DOCTYPE html>
<html>
<head>
    <title>Number Samrat - Engine v4.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .main-container { border: 3px solid #00ff00; padding: 25px; border-radius: 20px; background: #0a0a0a; display: inline-block; width: 95%; max-width: 500px; box-shadow: 0 0 20px #00ff00; }
        .win-box { font-size: 65px; color: #fff; text-shadow: 0 0 10px #00ff00; margin: 15px 0; font-weight: bold; border: 1px dashed #333; padding: 10px; }
        .terminal { background: #001100; border: 1px solid #004400; padding: 10px; height: 160px; overflow-y: auto; text-align: left; font-size: 12px; color: #00ff00; margin-top: 20px; }
        .badge { border: 1px solid #00ff00; padding: 3px 10px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 style="letter-spacing: 5px; margin-bottom: 5px;">ENGINE v4.0</h1>
        <div class="badge">[ ENGINE STATUS: MONITORING ✅ ]</div>
        <hr style="border: 0.5px solid #004400; margin: 20px 0;">
        
        <p style="color: #888; margin: 0;">LATEST LIVE RESULT:</p>
        <div id="win-number" class="win-box">--</div>
        <div id="market-name" style="font-size: 22px; color: #00e5ff; font-weight: bold;">WAITING...</div>

        <div id="logs" class="terminal">System Warm-up...</div>
    </div>

    <script>
        // --- FIREBASE CONFIG (Real ID) ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function addLog(m) {
            const l = document.getElementById('logs');
            l.innerHTML += "> " + m + "<br>";
            l.scrollTop = l.scrollHeight;
        }

        async function fetchResult() {
            addLog("Scanning markets for live numbers...");
            
            // Bhai, ye hai corrected URL (Bina 'T' ke)
            const targetUrl = "https://numbersamra-app-2.ai-st.workers.dev/get-result";
            const proxy = "https://api.allorigins.win/get?url=" + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(proxy);
                const raw = await response.json();
                const data = JSON.parse(raw.contents);
                
                if(data && data.number) {
                    document.getElementById('win-number').innerText = data.number;
                    document.getElementById('market-name').innerText = "MARKET: " + data.game.toUpperCase();
                    addLog("SUCCESS: Result Mil Gaya (" + data.number + ")");
                    
                    // Wallet automatic settlement
                    startSettlement(data.number, data.game);
                } else {
                    addLog("Wait: Naya result abhi market mein nahi aaya.");
                }
            } catch (err) {
                addLog("API Error: Link se data khinchne mein dikkat hai. Re-trying...");
            }
        }

        async function startSettlement(winNo, game) {
            addLog("Hisaab-Kitab shuru ho raha hai...");
            const snapshot = await db.collection("bets").where("gameName", "==", game).where("status", "==", "pending").get();

            if (snapshot.empty) {
                addLog("Is market ki koi nai bets nahi mili.");
                return;
            }

            const batch = db.batch();
            addLog(snapshot.size + " Bets mili hain. Processing...");

            snapshot.forEach(doc => {
                const b = doc.data();
                const uRef = db.collection("users").doc(b.userId);
                const kRef = db.collection("khaiwal").doc("stats");

                if (b.number === winNo) {
                    batch.update(uRef, { wallet: firebase.firestore.FieldValue.increment(b.amount * 90) });
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(-(b.amount * 90)) });
                    batch.update(doc.ref, { status: "win" });
                    addLog("User Winner: " + b.userId);
                } else {
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(b.amount) });
                    batch.update(doc.ref, { status: "loss" });
                }
            });

            await batch.commit();
            addLog("WALLETS UPDATED SUCCESSFULLY! ✅");
        }

        // Har 30 Second mein auto-run
        setInterval(fetchResult, 30000);
        fetchResult();

    </script>
</body>
</html>
