<!DOCTYPE html>
<html>
<head>
    <title>Number Samrat - Final Fix v19.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .main-card { border: 3px solid #ffd700; background: #111; padding: 30px; border-radius: 20px; display: inline-block; width: 95%; max-width: 450px; box-shadow: 0 0 20px #ffd700; }
        .input-box { margin: 15px 0; }
        input { padding: 15px; width: 85%; border-radius: 8px; border: 1px solid #ffd700; background: #000; color: #fff; font-size: 18px; text-align: center; }
        .btn-update { background: #ffd700; color: #000; border: none; padding: 15px; width: 92%; font-weight: bold; font-size: 18px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .btn-update:hover { background: #e6c200; }
        #logs { background: #000; color: #00ff00; padding: 10px; margin-top: 20px; height: 120px; overflow-y: auto; text-align: left; font-size: 12px; border: 1px solid #333; font-family: monospace; }
    </style>
</head>
<body>

    <div class="main-card">
        <h2 style="color: #ffd700; letter-spacing: 2px;">SAMRAT PANEL v19.0</h2>
        <p style="color: #aaa; font-size: 13px;">Result daalein aur "Settle" button dabayein.</p>
        <hr style="border: 0.5px solid #333;">

        <div class="input-box">
            <input type="text" id="marketName" placeholder="Market (e.g. Gali)">
        </div>
        <div class="input-box">
            <input type="text" id="winNumber" placeholder="Number (00-99)">
        </div>

        <button class="btn-update" onclick="processSettle()">SETTLE ALL WALLETS NOW</button>

        <div id="logs">System Ready...</div>
    </div>

    <script>
        // Firebase Config (100% Correct)
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function addLog(msg) {
            const l = document.getElementById('logs');
            l.innerHTML += "> " + msg + "<br>";
            l.scrollTop = l.scrollHeight;
        }

        async function processSettle() {
            const market = document.getElementById('marketName').value.trim();
            const winNo = document.getElementById('winNumber').value.trim();

            if(!market || !winNo) {
                alert("Bhai Market aur Number dono bharna zaroori hai!");
                return;
            }

            addLog("Checking bets for " + market + "...");

            try {
                // --- LINE 66: CORRECTED & STABLE VERSION ---
                const betsRef = db.collection("bets");
                const snapshot = await betsRef.where("gameName", "==", market).where("status", "==", "pending").get();

                if (snapshot.empty) {
                    addLog("Is market mein koi pending bet nahi mili.");
                    alert("No pending bets found!");
                    return;
                }

                addLog(snapshot.size + " bets mili hain. Hisaab ho raha hai...");
                const batch = db.batch();

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const userRef = db.collection("users").doc(data.userId);
                    const khaiwalRef = db.collection("khaiwal").doc("stats");
                    const amount = parseInt(data.amount);

                    if (data.number === winNo) {
                        // Winner Logic (90x)
                        batch.update(userRef, { "wallet": firebase.firestore.FieldValue.increment(amount * 90) });
                        batch.update(khaiwalRef, { "totalBalance": firebase.firestore.FieldValue.increment(-(amount * 90)) });
                        batch.update(doc.ref, { "status": "win" });
                    } else {
                        // Loser Logic
                        batch.update(khaiwalRef, { "totalBalance": firebase.firestore.FieldValue.increment(amount) });
                        batch.update(doc.ref, { "status": "loss" });
                    }
                });

                await batch.commit();
                addLog("SUCCESS! Sabka wallet update ho gaya. ✅");
                alert("Mubarak ho! Saara hisaab automatic ho gaya.");
                document.getElementById('winNumber').value = "";

            } catch (error) {
                addLog("Error: " + error.message);
                console.error(error);
                alert("Kuch galat hua. Check Console.");
            }
        }
    </script>
</body>
</html>
