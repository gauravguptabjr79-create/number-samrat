<!DOCTYPE html>
<html>
<head>
    <title>Number Samrat - Final Engine v8.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { background: #0a0a0a; color: #ffd700; font-family: 'Courier New', Courier, monospace; text-align: center; padding: 20px; }
        .engine-box { border: 3px solid #ffd700; background: #111; padding: 30px; border-radius: 20px; display: inline-block; width: 95%; max-width: 500px; box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); }
        .win-display { font-size: 80px; color: #fff; text-shadow: 0 0 15px #ffd700; margin: 20px 0; font-weight: bold; }
        .log-terminal { background: #000; color: #ffd700; text-align: left; padding: 15px; font-size: 12px; height: 180px; overflow-y: auto; margin-top: 20px; border: 1px solid #333; }
        .status-tag { border: 1px solid #ffd700; padding: 5px 15px; font-weight: bold; margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>

    <div class="engine-box">
        <h1>SAMRAT ENGINE v8.0 🏆</h1>
        <div id="status" class="status-tag">SYSTEM: INITIALIZING...</div>
        <hr style="border: 0.5px solid #333;">
        
        <p style="color: #888;">LATEST LIVE RESULT:</p>
        <div id="win-number" class="win-display">--</div>
        <div id="market-name" style="font-size: 24px; color: #00e5ff; font-weight: bold;">WAITING...</div>

        <div id="logs" class="log-terminal">Engine Booting Up...</div>
    </div>

    <script>
        // --- APKI FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        // Firebase Start
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function writeLog(m) {
            const l = document.getElementById('logs');
            l.innerHTML += "> " + m + "<br>";
            l.scrollTop = l.scrollHeight;
        }

        async function fetchResult() {
            writeLog("Scanning for result...");
            document.getElementById('status').innerText = "SYSTEM: SCANNING LIVE ✅";
            
            // Bhai, ye aapka exact URL hai
            const target = "https://numbersamra-app-2.ai.studio/get-result";
            const proxy = "https://api.allorigins.win/get?url=" + encodeURIComponent(target);

            try {
                const response = await fetch(proxy);
                const raw = await response.json();
                const data = JSON.parse(raw.contents);
                
                if(data && data.number) {
                    document.getElementById('win-number').innerText = data.number;
                    document.getElementById('market-name').innerText = "MARKET: " + data.game.toUpperCase();
                    writeLog("SUCCESS: Result found: " + data.number);
                    
                    // Wallet automatic settlement
                    startSettlement(data.number, data.game);
                } else {
                    writeLog("Wait: Naye result ka intezar hai...");
                }
            } catch (err) {
                writeLog("Network error. Retrying in 30 seconds...");
            }
        }

        async function startSettlement(winNo, market) {
            writeLog("Database checking for bets...");
            const snapshot = await db.collection("bets").where("gameName", "==", market).where("status", "==", "pending").get();

            if (snapshot.empty) {
                writeLog("No pending bets for this market.");
                return;
            }

            const batch = db.batch();
            writeLog("Updating " + snapshot.size + " wallets...");

            snapshot.forEach(doc => {
                const b = doc.data();
                const uRef = db.collection("users").doc(b.userId);
                const kRef = db.collection("khaiwal").doc("stats");

                if (b.number === winNo) {
                    // Winner Update
                    batch.update(uRef, { wallet: firebase.firestore.FieldValue.increment(parseInt(b.amount) * 90) });
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(-(parseInt(b.amount) * 90)) });
                    batch.update(doc.ref, { status: "win" });
                } else {
                    // Loser Update
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(parseInt(b.amount)) });
                    batch.update(doc.ref, { status: "loss" });
                }
            });

            await batch.commit();
            writeLog("WALLETS UPDATED SUCCESSFULLY! ✅");
        }

        // Run Every 30 Seconds
        setInterval(fetchResult, 30000);
        fetchResult();

    </script>
</body>
</html>
