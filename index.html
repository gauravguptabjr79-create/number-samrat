<!DOCTYPE html>
<html>
<head>
    <title>Number Samrat - Auto Wallet Engine</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        /* Matrix Theme - Taaki aapko pata chale code badal gaya hai */
        body { background: #000; color: #00ff00; font-family: 'Courier New', Courier, monospace; text-align: center; padding: 20px; }
        .engine-box { border: 2px solid #00ff00; background: #0a0a0a; padding: 25px; border-radius: 15px; display: inline-block; width: 95%; max-width: 500px; box-shadow: 0 0 20px #00ff00; }
        .win-no { font-size: 60px; color: #fff; text-shadow: 0 0 10px #00ff00; margin: 15px 0; font-weight: bold; }
        .log-box { background: #001100; border: 1px solid #004400; padding: 10px; height: 160px; overflow-y: auto; text-align: left; font-size: 12px; color: #00cc00; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="engine-box">
        <h1 style="letter-spacing: 3px;">NUMBER SAMRAT ENGINE</h1>
        <div id="status" style="color: #00ff00;">[ ENGINE STATUS: BOOTING... ]</div>
        <hr style="border: 0.5px solid #004400;">
        
        <p style="color: #888; margin-bottom: 0;">LATEST RESULT FOUND:</p>
        <div id="win-number" class="win-no">--</div>
        <div id="market-name" style="font-size: 20px; color: #00e5ff; font-weight: bold;">WAITING...</div>

        <div id="logs" class="log-box">System Initializing...</div>
    </div>

    <script>
        // --- APKI FIREBASE CONFIG (No changes) ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function addLog(m) {
            const logs = document.getElementById('logs');
            logs.innerHTML += "> " + m + "<br>";
            logs.scrollTop = logs.scrollHeight;
        }

        async function fetchMarketResults() {
            addLog("Market scan shuru...");
            document.getElementById('status').innerText = "[ ENGINE STATUS: MONITORING ✅ ]";
            
            // Proxy ka use taaki browser block na kare
            const proxy = "https://api.allorigins.win/get?url=";
            const target = encodeURIComponent("https://numbersamrat-app-2.ai-st.workers.dev/get-result");

            try {
                const response = await fetch(proxy + target);
                const rawData = await response.json();
                const data = JSON.parse(rawData.contents);
                
                if(data.number) {
                    document.getElementById('win-number').innerText = data.number;
                    document.getElementById('market-name').innerText = "MARKET: " + data.game.toUpperCase();
                    addLog("Live Result Mil Gaya: " + data.number + " (" + data.game + ")");
                    
                    // Wallet automatic update logic
                    settleWallets(data.number, data.game);
                }
            } catch (err) {
                addLog("Wait: Naye result ka intezar hai...");
            }
        }

        async function settleWallets(resultNo, market) {
            addLog("Database mein bets check ho rahi hain...");
            const snapshot = await db.collection("bets").where("gameName", "==", market).where("status", "==", "pending").get();

            if (snapshot.empty) {
                addLog("Is market ki koi nai bet nahi hai.");
                return;
            }

            const batch = db.batch();
            addLog(snapshot.size + " Bets mili hain. Wallet update shuru...");

            snapshot.forEach(doc => {
                const bet = doc.data();
                const userRef = db.collection("users").doc(bet.userId);
                const khaiwalRef = db.collection("khaiwal").doc("stats");

                if (bet.number === resultNo) {
                    // USER WIN: 90 Guna Paisa
                    batch.update(userRef, { wallet: firebase.firestore.FieldValue.increment(bet.amount * 90) });
                    batch.update(khaiwalRef, { totalBalance: firebase.firestore.FieldValue.increment(-(bet.amount * 90)) });
                    batch.update(doc.ref, { status: "win" });
                    addLog("Winner Updated: " + bet.userId);
                } else {
                    // USER LOSS: Khaiwal ka profit
                    batch.update(khaiwalRef, { totalBalance: firebase.firestore.FieldValue.increment(bet.amount) });
                    batch.update(doc.ref, { status: "loss" });
                }
            });

            await batch.commit();
            addLog("Hisaab poora ho gaya! ✅");
        }

        // Har 30 second mein check karega
        setInterval(fetchMarketResults, 30000);
        fetchMarketResults();

    </script>
</body>
</html>
