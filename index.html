<!DOCTYPE html>
<html>
<head>
    <title>Number Samrat - Master Engine v17.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { background: #000; color: #ffd700; font-family: 'Arial', sans-serif; text-align: center; padding: 20px; }
        .main-card { border: 3px solid #ffd700; background: #111; padding: 30px; border-radius: 20px; display: inline-block; width: 95%; max-width: 500px; box-shadow: 0 0 25px rgba(255,215,0,0.3); }
        .result-circle { font-size: 70px; color: #fff; text-shadow: 0 0 15px #ffd700; margin: 15px 0; font-weight: bold; }
        .manual-section { background: #222; padding: 20px; border-radius: 15px; margin-top: 25px; border: 1px solid #444; }
        .input-box { padding: 10px; width: 80px; font-size: 18px; text-align: center; border-radius: 5px; border: 1px solid #ffd700; background: #000; color: #fff; margin: 5px; }
        .action-btn { background: #ffd700; color: #000; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; margin-top: 10px; }
        .terminal { background: #000; color: #00ff00; text-align: left; padding: 10px; font-size: 11px; height: 130px; overflow-y: auto; margin-top: 20px; border: 1px solid #333; font-family: monospace; }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>SAMRAT MASTER DASHBOARD</h1>
        <div id="status" style="color: #00ff00; font-weight: bold;">[ SYSTEM READY ]</div>
        <hr style="border: 0.5px solid #333; margin: 20px 0;">
        
        <p style="color: #888; margin: 0;">LIVE RESULT FOUND:</p>
        <div id="win-number" class="result-circle">--</div>
        <div id="market-name" style="font-size: 22px; color: #00e5ff; font-weight: bold;">WAITING...</div>

        <!-- Manual Settle Section: Agar auto fail ho toh ye kaam karega -->
        <div class="manual-section">
            <p style="margin: 0 0 10px 0; color: #ffd700; font-size: 14px; font-weight: bold;">AGAR AUTO FAIL HO, TOH NO. DAALEIN:</p>
            <input type="text" id="m-num" class="input-box" placeholder="NO.">
            <input type="text" id="m-market" class="input-box" style="width: 120px;" placeholder="MARKET">
            <button class="action-btn" onclick="manualUpdate()">HISAAB KARO & SETTLE</button>
        </div>

        <div id="logs" class="terminal">Initializing v17.0 Engine...</div>
    </div>

    <script>
        // --- 1. CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function addLog(m) {
            const l = document.getElementById('logs');
            l.innerHTML += "> " + m + "<br>";
            l.scrollTop = l.scrollHeight;
        }

        // --- 2. AUTOMATIC SCAN ---
        async function autoScan() {
            addLog("Auto-scanning live results...");
            const target = "https://numbersamra-app-2.ai-st.workers.dev/get-result";
            
            // Is baar naya proxy bypass
            try {
                const response = await fetch("https://corsproxy.io/?" + encodeURIComponent(target + "?t=" + Date.now()));
                const data = await response.json();
                if(data && data.number) {
                    processHisaab(data.number, data.game);
                }
            } catch (err) {
                addLog("Auto-fetch blocked by security. System in manual standby.");
            }
        }

        // --- 3. MANUAL COMMAND ---
        function manualUpdate() {
            const num = document.getElementById('m-num').value;
            const market = document.getElementById('m-market').value;
            if(!num || !market) { alert("Bhai Number aur Market dono likho!"); return; }
            
            addLog("Manual command received for " + market + " result " + num);
            processHisaab(num, market);
        }

        function processHisaab(winNo, market) {
            document.getElementById('win-number').innerText = winNo;
            document.getElementById('market-name').innerText = market.toUpperCase();
            document.getElementById('status').innerText = "[ SETTLING PAYMENTS... ]";
            settleWallets(winNo, market);
        }

        async function settleWallets(winNo, market) {
            addLog("Database mein bets check ho rahi hain...");
            const snapshot = await db.collection("bets").where("gameName", "==", market).where("status", "==", "pending").get();

            if (snapshot.empty) {
                addLog("Is market ki koi nai bet nahi mili.");
                document.getElementById('status').innerText = "[ READY ]";
                return;
            }

            const batch = db.batch();
            snapshot.forEach(doc => {
                const b = doc.data();
                const uRef = db.collection("users").doc(b.userId);
                const kRef = db.collection("khaiwal").doc("stats");
                const amt = parseInt(b.amount);

                if (b.number === winNo) {
                    // Winner
                    batch.update(uRef, { wallet: firebase.firestore.FieldValue.increment(amt * 90) });
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(-(amt * 90)) });
                    batch.update(doc.ref, { status: "win" });
                } else {
                    // Loser
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(amt) });
                    batch.update(doc.ref, { status: "loss" });
                }
            });

            await batch.commit();
            addLog("SUCCESS: " + snapshot.size + " bets settled. ✅");
            alert("Mubarak ho! Sabka wallet update ho gaya.");
            document.getElementById('status').innerText = "[ READY ]";
        }

        setInterval(autoScan, 60000); // 1 min auto
        autoScan();

    </script>
</body>
</html>
