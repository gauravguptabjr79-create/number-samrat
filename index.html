<!DOCTYPE html>
<html>
<head>
    <title>Number Samrat Engine v3.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .engine-card { border: 2px solid #00ff00; background: #111; padding: 25px; border-radius: 15px; display: inline-block; width: 95%; max-width: 450px; box-shadow: 0 0 15px #00ff00; }
        .win-display { font-size: 55px; color: #fff; text-shadow: 0 0 10px #00ff00; margin: 15px 0; }
        .log-terminal { background: #000; color: #00ff00; text-align: left; padding: 10px; font-size: 11px; height: 160px; overflow-y: auto; margin-top: 20px; border: 1px solid #333; }
        .status-ok { color: #00ff00; font-weight: bold; border: 1px solid #00ff00; padding: 5px 10px; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="engine-card">
        <h2>NUMBER SAMRAT ENGINE 🚀</h2>
        <div class="status-ok">[ SYSTEM ONLINE ]</div>
        <hr style="border: 0.5px solid #333;">
        
        <p style="color: #888; margin-bottom: 5px;">LIVE WINNING NUMBER:</p>
        <div id="result-num" class="win-display">--</div>
        <div id="market-info" style="color: #00d2ff; font-size: 18px; font-weight: bold;">SCANNING...</div>

        <div id="terminal" class="log-terminal">Engine Warm-up...</div>
    </div>

    <script>
        // --- FIREBASE CONFIG (APKI WAHI PURANI ID) ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
            authDomain: "number-samrat.firebaseapp.com",
            projectId: "number-samrat",
            storageBucket: "number-samrat.firebasestorage.app",
            messagingSenderId: "154722781783",
            appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function log(m) {
            const t = document.getElementById('terminal');
            t.innerHTML += "> " + m + "<br>";
            t.scrollTop = t.scrollHeight;
        }

        async function fetchLiveResult() {
            log("Result check karne ki koshish...");
            
            // Ye proxy sabse zyada stable hai
            const proxy = "https://api.allorigins.win/get?url=";
            const api = encodeURIComponent("https://numbersamrat-app-2.ai-st.workers.dev/get-result");

            try {
                const response = await fetch(proxy + api);
                const json = await response.json();
                const data = JSON.parse(json.contents);
                
                if(data && data.number) {
                    document.getElementById('result-num').innerText = data.number;
                    document.getElementById('market-info').innerText = "MARKET: " + data.game.toUpperCase();
                    log("Result Mil Gaya: " + data.number + " (" + data.game + ")");
                    
                    // Wallet Update Logic
                    runWalletEngine(data.number, data.game);
                } else {
                    log("Wait: Result site par abhi update nahi hua.");
                }
            } catch (err) {
                log("Fetch Error: Re-trying in 30 seconds...");
            }
        }

        async function runWalletEngine(winNo, market) {
            log("Database scan shuru...");
            const snapshot = await db.collection("bets").where("gameName", "==", market).where("status", "==", "pending").get();

            if (snapshot.empty) {
                log("Koi pending bet nahi mili.");
                return;
            }

            const batch = db.batch();
            log(snapshot.size + " Bets mili hain. Hisaab ho raha hai...");

            snapshot.forEach(doc => {
                const bet = doc.data();
                const uRef = db.collection("users").doc(bet.userId);
                const kRef = db.collection("khaiwal").doc("stats");

                if (bet.number === winNo) {
                    batch.update(uRef, { wallet: firebase.firestore.FieldValue.increment(bet.amount * 90) });
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(-(bet.amount * 90)) });
                    batch.update(doc.ref, { status: "win" });
                    log("Winner: " + bet.userId + " (+)");
                } else {
                    batch.update(kRef, { totalBalance: firebase.firestore.FieldValue.increment(bet.amount) });
                    batch.update(doc.ref, { status: "loss" });
                }
            });

            await batch.commit();
            log("WALLET UPDATE SUCCESS! ✅");
        }

        // Har 30 Second mein check
        setInterval(fetchLiveResult, 30000);
        fetchLiveResult();

    </script>
</body>
</html>
